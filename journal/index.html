<script>
/* 서비스워커 — 새 버전이 준비되면 한 번만 새로고침해서 최신 화면을 보여 준다 */
(function(){
  if(!('serviceWorker' in navigator))return;
  var hadController=!!navigator.serviceWorker.controller, reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadController||reloaded)return;reloaded=true;location.reload();
  });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js?v=20261126c1').catch(function(){});
  });
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('btnInstall');
    if(!b)return;
    var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
    if(standalone)return;
    b.hidden=false;
    b.addEventListener('click',function(){ if(window.App&&App.installGuide)App.installGuide(); });
  });
})();
</script>
