<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>박재용 목사 목회 일지</title>
<meta name="description" content="박재용 목사 목회 일지 — 일지·스케줄·상담·캘린더·목회 메모·설교 준비">
<meta name="theme-color" content="#0a1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="목회 일지">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4.6h6a2 2 0 0 1 2 2v12.8a2 2 0 0 0-2-2H4z"/>
        <path d="M20 4.6h-6a2 2 0 0 0-2 2v12.8a2 2 0 0 1 2-2h6z"/>
        <path d="M12 8.6v3.2M10.4 10.2h3.2" stroke-width="1.3"/>
      </svg>
    </span>
    <div>
      <h1><span class="who">박재용 목사</span> 목회 일지</h1>
      <span class="sub" id="barDate">오늘</span>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btnExport" title="JSON 내보내기" aria-label="JSON 내보내기">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v12M7.5 11l4.5 4.5 4.5-4.5M4.5 20.5h15"/></svg>
    </button>
    <button class="icon-btn" id="btnImport" title="JSON 가져오기" aria-label="JSON 가져오기">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5v-12M7.5 13 12 8.5l4.5 4.5M4.5 3.5h15"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="main">
  <section class="screen on" id="sc-home"></section>
  <section class="screen" id="sc-journal"></section>
  <section class="screen" id="sc-schedule"></section>
  <section class="screen" id="sc-counsel"></section>
  <section class="screen" id="sc-calendar"></section>
  <section class="screen" id="sc-notes"></section>
  <section class="screen" id="sc-sermons"></section>
  <section class="screen" id="sc-vehicle"></section>
  <section class="screen" id="sc-food"></section>
</main>

<nav class="tabbar" id="tabs" aria-label="주요 화면"></nav>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>

<script src="seed.js"></script>
<script src="seed-restaurants.js"></script>
<script src="core.js"></script>
<script src="icons.js"></script>
<script src="view-home.js"></script>
<script src="view-journal.js"></script>
<script src="view-schedule.js"></script>
<script src="view-counsel.js"></script>
<script src="view-calendar.js"></script>
<script src="view-notes.js"></script>
<script src="view-sermons.js"></script>
<script src="view-vehicle.js"></script>
<script src="view-food.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
