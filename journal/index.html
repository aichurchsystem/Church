<script>
/* ── 서비스워커 ──────────────────────────────────────────────
   새 버전이 준비되면 한 번만 새로고침하고, sw.js 자체는 늘 새로 확인한다. */
(function(){
  if(!('serviceWorker' in navigator))return;
  var reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(reloaded)return;reloaded=true;location.reload();
  });
  try{
    navigator.serviceWorker.register('sw.js?v=20261127k',{updateViaCache:'none'}).then(function(r){
      try{r.update()}catch(e){}
    }).catch(function(){});
  }catch(e){}
})();

/* ── 빈 화면 감시기 ──────────────────────────────────────────
   스크립트 하나가 늦거나 실패해 메인이 비어 있으면, 손으로 눌러 들어갈 수 있는
   타일 메뉴를 즉시 대신 그린다. (앱이 아무것도 안 보이는 일은 없게) */
(function(){
  var TILES=[['report','에스더 보고'],['journal','오늘 일지'],['schedule','스케줄'],['counsel','상담 일지'],
             ['sermons','설교 준비'],['vehicle','차량 관리'],['food','다녀온 곳'],['workout','운동일지']];
  function drawFallback(){
    if(window.__mjBooted)return;
    var el=document.getElementById('sc-home');
    if(!el||el.innerHTML.trim().length>0)return;
    if(window.App&&App.homeFallback){try{App.homeFallback();return}catch(e){}}
    el.innerHTML='<div style="padding:4px 2px 0">'
      +'<div style="font-size:15px;font-weight:800;color:#fff;margin-bottom:4px">박재용 목사 목회 일지</div>'
      +'<div style="font-size:13px;color:#a9b7ca;margin-bottom:12px">메뉴를 불러오는 중입니다. 아래에서 바로 들어갈 수 있습니다.</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
      +TILES.map(function(t){return '<button type="button" data-action="tab" data-tab="'+t[0]+'" '
        +'style="min-height:96px;border-radius:16px;border:1px solid rgba(255,255,255,.14);'
        +'background:linear-gradient(160deg,#16202e,#101925);color:#fff;font-size:16px;font-weight:800">'+t[1]+'</button>'}).join('')
      +'</div></div>';
  }
  setTimeout(drawFallback,1800);
  document.addEventListener('DOMContentLoaded',function(){setTimeout(drawFallback,1200)});
  window.addEventListener('error',function(){setTimeout(drawFallback,300)},true);
})();
</script>
