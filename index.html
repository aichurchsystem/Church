<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동일지</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e5e9f2; --line2:#eef1f7;
    --text:#141926; --dim:#69718a; --faint:#7b8396;
    --brand:#5a45e8; --brand2:#8b6cf6; --danger:#d33b46;
    --sh:0 1px 2px rgba(20,25,38,.05), 0 5px 16px rgba(20,25,38,.05);
    --c:#f0564a; --cd:#c9342a; --cl:#ffedea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    padding-bottom:88px}
  header{padding:20px 16px 12px;position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line)}
  header:before{content:'';position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,#f0564a,#f59b2e,#2fb45e,#0fb39c,#1fa9e0,#3b82f6,#7b5cf5)}
  h1{font-size:19px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:4px}
  .wrap{padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
  .card.flash{animation:flash .9s ease}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(90,69,232,.45)}100%{box-shadow:0 0 0 14px rgba(90,69,232,0)}}
  .row{display:flex;gap:10px}
  .row > *{flex:1;min-width:0}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px 2px}
  input,select,textarea,button{font:inherit;color:var(--text)}
  input,select,textarea{width:100%;background:#f8f9fd;border:1.5px solid #e2e7f1;border-radius:12px;padding:12px;font-size:16px}
  input::placeholder{color:#a7aec0}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);background:#fff}

  /* 부위 칩 */
  .chiplabel{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.2px;margin:0 0 9px 2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:#fff;
    border:1.5px solid var(--line);border-radius:999px;padding:9px 15px 9px 12px;
    font-size:13.5px;font-weight:600;color:#3b4357;line-height:1}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
  .chip.on{background:var(--cd);border-color:var(--cd);color:#fff;box-shadow:0 5px 12px rgba(20,25,38,.16)}
  .chip.on i{background:#fff}
  .chip:active{transform:scale(.97)}

  .btn{width:100%;padding:15px;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:16px;
    background:linear-gradient(135deg,#6f5bf7,#4a33d6);box-shadow:0 8px 18px rgba(90,69,232,.28)}
  .btn:active{opacity:.9}

  .tabs{display:flex;background:#e9ecf5;border-radius:14px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;background:none;border:0;padding:10px;border-radius:11px;color:#5c6478;font-size:14px;font-weight:600}
  .tabs button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(20,25,38,.09)}

  .stat{display:flex;gap:10px;margin-bottom:12px}
  .stat > div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--sh)}
  .stat b{display:block;font-size:21px;margin-top:5px;letter-spacing:-.5px;color:var(--brand)}
  .stat .s2 b{color:#0b8b7a}
  .stat span{font-size:11.5px;color:var(--dim)}

  .day{margin:16px 0 7px;font-size:13px;color:#4d5568;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .day span:last-child{color:var(--faint);font-weight:500;font-size:12px}
  .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
  .item:last-child{border-bottom:0}
  .item .name{flex:1;min-width:0}
  .item .name b{font-weight:600;font-size:15px}
  .item .name small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
  .item .vol{color:#4a5568;font-size:13px;font-weight:600;white-space:nowrap}
  .ptag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;
    background:var(--cl);color:var(--cd);margin-right:5px;vertical-align:1px}
  .del{background:none;border:0;color:#98a0b3;font-size:19px;padding:4px 2px}
  .empty{color:var(--dim);font-size:13.5px;text-align:center;padding:26px 8px;line-height:1.7}
  .bar{height:9px;background:#eef1f7;border-radius:6px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
  .part{margin-bottom:13px}
  .part:last-child{margin-bottom:2px}
  .part .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .part .top span:last-child{color:var(--dim);font-weight:500;font-size:12.5px}
  .dotr{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
  .hint{font-size:12px;color:var(--dim);margin:8px 2px 0;line-height:1.6}
  .footnote{font-size:11.5px;color:var(--faint);text-align:center;margin:20px 0 8px}
  a.link{color:var(--brand);text-decoration:none;font-size:12.5px;font-weight:600}
  .hide{display:none}

  .cardhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .cardhead b{font-size:15px;letter-spacing:-.2px}
  .cardhead span{font-size:11.5px;color:var(--faint)}

  .sec{margin-bottom:14px}
  .seclabel{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.2px;margin:0 0 8px 2px}

  /* 내 운동: 두 칸 압축 목록 */
  .favgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fav{display:flex;align-items:center;gap:8px;min-width:0;background:#fff;border:1.5px solid var(--line);
    border-radius:13px;padding:6px 8px 6px 6px;text-align:left;position:relative;overflow:hidden}
  .fav:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .fav img{width:36px;height:36px;border-radius:10px;object-fit:cover;background:#eceef3;flex:0 0 auto;display:block}
  .fav .t{min-width:0;flex:1}
  .fav b{display:block;font-size:12.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .fav small{display:block;font-size:10.5px;color:#6f7789;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav:active{background:var(--cl);border-color:var(--c)}

  /* 내 기록에서 */
  .minichips{display:flex;flex-wrap:wrap;gap:7px}
  .mrow{display:flex;align-items:center;gap:7px;background:#f6f7fc;border:1.5px solid var(--line);
    border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:600;color:#39405250}
  .mrow{color:#394052}
  .mrow img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#eceef3;display:block}
  .mrow:active{border-color:var(--brand);background:#fff}

  /* 부위 추천 헤더 밴드 */
  .pband{display:flex;align-items:center;gap:8px;background:var(--cl);border-left:4px solid var(--c);
    border-radius:10px;padding:9px 11px;margin:0 0 10px}
  .pband b{font-size:14px;font-weight:800;color:var(--cd);letter-spacing:-.2px}
  .pband span{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--cd);opacity:.75}

  /* 추천 목록 */
  .reco{display:flex;flex-direction:column;gap:9px}
  .reco button{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:#fff;
    border:1.5px solid var(--line);border-radius:14px;padding:9px 11px 9px 9px;font-size:13.5px;
    text-align:left;line-height:1.35;overflow:hidden}
  .reco button:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .reco button:active{background:var(--cl);border-color:var(--c)}
  .reco .txt{flex:1;min-width:0;padding-left:4px}
  .reco .txt b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.2px}
  .reco .txt small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
  .reco .plus{flex:0 0 auto;font-size:15px;font-weight:800;color:var(--cd);opacity:.55;padding-right:2px}
  .thumb{width:52px;height:52px;flex:0 0 auto;border-radius:12px;object-fit:cover;background:#eceef3;display:block}
  .ico{width:22px;height:22px;flex:0 0 auto;color:var(--c)}
  .ico.big{width:38px;height:38px}

</style>
</head>
<body>
<header>
  <h1>운동일지</h1>
  <div class="sub" id="today"></div>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="tabWrite" class="on">기록하기</button>
    <button id="tabStat">통계</button>
  </div>

  <!-- 기록 -->
  <section id="viewWrite">
    <div class="card">
      <div class="chiplabel">부위</div>
      <div class="chips" id="partChips"></div>
    </div>

    <div class="card" id="recoCard">
      <div class="cardhead"><b>추천 종목</b><span>눌러서 담기</span></div>

      <div class="sec hide" id="favWrap">
        <div class="seclabel">내 운동</div>
        <div class="favgrid" id="favBox"></div>
      </div>

      <div class="sec hide" id="mineWrap">
        <div class="seclabel">내 기록에서</div>
        <div class="minichips" id="mineBox"></div>
      </div>

      <div class="pband" id="recoBand"><b id="recoLabel">가슴 추천</b><span id="recoCount">5종목</span></div>
      <div class="reco" id="recoBox"></div>
      <div class="hint" style="margin-top:11px">종목을 누르면 아래 기록 칸에 채워집니다. 무게는 지난 기록 보시고 맞춰 올리세요.</div>
    </div>

    <div class="card" id="formCard">
      <div class="cardhead"><b>기록 입력</b><span id="formPart">가슴</span></div>
      <div class="row" style="margin-bottom:10px">
        <div>
          <label>종목</label>
          <input id="ex" list="exList" placeholder="벤치프레스" autocomplete="off">
          <datalist id="exList"></datalist>
        </div>
      </div>
      <div class="row" style="margin-bottom:10px">
        <div><label>무게(kg)</label><input id="w" type="number" inputmode="decimal" step="0.5" placeholder="40"></div>
        <div><label>횟수</label><input id="r" type="number" inputmode="numeric" placeholder="10"></div>
        <div><label>세트</label><input id="s" type="number" inputmode="numeric" placeholder="3"></div>
      </div>
      <div style="margin-bottom:12px">
        <label>메모 (선택)</label>
        <input id="m" placeholder="컨디션, 자세 등">
      </div>
      <button class="btn" id="save">저장</button>
      <div class="hint" id="lastHint"></div>
    </div>

    <div id="list"></div>

    <div class="footnote">기록은 이 폰에만 저장됩니다 · <a class="link" href="#" id="exportBtn">파일로 내보내기</a></div>
  </section>

  <!-- 통계 -->
  <section id="viewStat" class="hide">
    <div class="stat">
      <div><span>이번 주 볼륨</span><b id="sWeek">0</b></div>
      <div class="s2"><span>이번 주 운동일</span><b id="sDays">0</b></div>
    </div>
    <div class="card">
      <div class="cardhead"><b>부위별 볼륨</b><span>최근 30일</span></div>
      <div id="partStat"></div>
    </div>
    <div class="card">
      <div class="cardhead"><b>최근 6주</b><span>주간 볼륨</span></div>
      <div id="weekStat"></div>
    </div>
    <div class="card">
      <div class="cardhead"><b>종목별 최고 무게</b><span>상위 12개</span></div>
      <div id="prStat"></div>
    </div>
  </section>
</div>

<script>
const KEY='workoutlog.v1';
const PARTS=['가슴','등','하체','어깨','팔','복부','유산소'];

/* ── 부위별 색: c=기본, cd=진한색(흰 글씨용), cl=연한 배경 ── */
const PART_COLOR={
  '가슴':{c:'#f0564a',cd:'#c9342a',cl:'#ffedea'},
  '등'  :{c:'#0fb39c',cd:'#067a6b',cl:'#e3f8f3'},
  '하체':{c:'#7b5cf5',cd:'#573bd6',cl:'#eeebff'},
  '어깨':{c:'#f59b2e',cd:'#a95f06',cl:'#fff3e0'},
  '팔'  :{c:'#3b82f6',cd:'#1c5ccc',cl:'#e8f1ff'},
  '복부':{c:'#2fb45e',cd:'#17793f',cl:'#e7f8ed'},
  '유산소':{c:'#1fa9e0',cd:'#0b78a8',cl:'#e4f6fd'}
};
const PC=p=>PART_COLOR[p]||PART_COLOR['가슴'];
function paintColor(el,p){
  const k=PC(p);
  el.style.setProperty('--c',k.c);
  el.style.setProperty('--cd',k.cd);
  el.style.setProperty('--cl',k.cl);
}

/* ── 기구 사전: 이름, 모양 설명, 그림(선 도해) ── */
const EQUIP={
  barbell:{n:'바벨',d:'양쪽에 원판을 끼우는 긴 쇠막대. 봉만 보통 20kg.',
    s:'<path d="M7 24h34"/><rect x="9" y="15" width="5" height="18" rx="1.6"/><rect x="34" y="15" width="5" height="18" rx="1.6"/>'},
  dumbbell:{n:'덤벨',d:'한 손에 하나씩 드는 짧은 막대. 양 끝에 무게 뭉치.',
    s:'<path d="M19 24h10"/><rect x="10" y="16" width="6" height="16" rx="2"/><rect x="32" y="16" width="6" height="16" rx="2"/>'},
  bench:{n:'플랫 벤치',d:'바닥에 누워 쓰는 평평한 의자. 등받이 각도 없음.',
    s:'<path d="M8 25h32"/><path d="M15 25v9"/><path d="M33 25v9"/><path d="M10 34h10"/><path d="M28 34h10"/>'},
  incline:{n:'인클라인 벤치',d:'등받이가 30~45도로 올라간 벤치. 윗가슴 운동에 씀.',
    s:'<path d="M11 34l9-17"/><path d="M24 31h14"/><path d="M18 31v7"/><path d="M33 31v7"/>'},
  rack:{n:'스쿼트 랙',d:'바벨을 걸어 두는 두 기둥 틀. 서서 스쿼트할 때 씀.',
    s:'<path d="M14 41V7"/><path d="M34 41V7"/><path d="M14 17h20"/><path d="M17 17v5"/><path d="M31 17v5"/>'},
  cable:{n:'케이블 머신',d:'도르래에 줄이 달린 기둥 기구. 손잡이를 당겨 씀.',
    s:'<rect x="9" y="8" width="9" height="32" rx="2"/><circle cx="20" cy="14" r="2.4"/><path d="M22.4 14H32"/><path d="M32 14v12"/><path d="M28 26h8"/>'},
  latpull:{n:'랫풀다운',d:'머리 위 긴 바를 아래로 당기는 기구. 앉아서 함.',
    s:'<path d="M12 41V8h24"/><path d="M16 13h16"/><path d="M16 13v4"/><path d="M32 13v4"/><path d="M19 32h10"/>'},
  row:{n:'시티드 로우',d:'앉아서 가슴 쪽으로 손잡이를 당기는 기구.',
    s:'<rect x="7" y="28" width="13" height="7" rx="2"/><path d="M20 31.5h7"/><circle cx="30" cy="31.5" r="2.6"/><path d="M30 29V18"/><path d="M23 18h14"/>'},
  legpress:{n:'레그프레스',d:'앉아서 두 발로 판을 앞으로 미는 기구. 하체 전체.',
    s:'<path d="M8 41V28a2 2 0 012-2h8v7"/><path d="M18 25h9"/><path d="M35 11l-6 26"/><path d="M40 13l-6 26"/>'},
  legcurl:{n:'레그컬',d:'앉거나 엎드려 다리 뒤꿈치를 말아 올리는 기구.',
    s:'<path d="M6 22h19"/><path d="M10 22v10"/><path d="M19 22v10"/><path d="M25 22h9"/><circle cx="34" cy="28" r="5"/>'},
  dip:{n:'평행봉',d:'두 개의 평행한 봉. 팔로 몸을 지지하고 내려갔다 올라옴.',
    s:'<path d="M12 41V15"/><path d="M12 15h8"/><path d="M28 15h8"/><path d="M36 41V15"/>'},
  pullup:{n:'풀업 바',d:'머리 위 가로 막대. 매달려 몸을 끌어올림.',
    s:'<path d="M6 15h36"/><path d="M11 7v8"/><path d="M37 7v8"/><path d="M18 15v6"/><path d="M30 15v6"/>'},
  machine:{n:'웨이트 머신',d:'무게추가 쌓인 기구. 핀을 꽂아 무게를 정함.',
    s:'<rect x="9" y="7" width="10" height="34" rx="2"/><path d="M11 14h6"/><path d="M11 20h6"/><path d="M11 26h6"/><path d="M22 33h13"/><path d="M28 33v5"/>'},
  treadmill:{n:'트레드밀',d:'돌아가는 벨트 위를 걷거나 뛰는 기구. 속도 조절 가능.',
    s:'<path d="M7 36h22l8-6"/><path d="M30 30h9"/><path d="M35 30V16"/><path d="M30 16h10"/><path d="M11 36v5"/><path d="M26 36v5"/>'},
  bike:{n:'실내 사이클',d:'앉아서 페달을 밟는 자전거. 무릎 부담이 적음.',
    s:'<circle cx="15" cy="33" r="6.5"/><circle cx="35" cy="33" r="6.5"/><path d="M15 33l7-13h8l5 13"/><path d="M22 20h7"/><path d="M30 20l-4-6"/>'},
  rower:{n:'로잉머신',d:'노젓듯 앉아서 손잡이를 당기는 기구. 전신 운동.',
    s:'<path d="M6 38h36"/><rect x="14" y="31" width="11" height="5" rx="2"/><path d="M9 34v-9"/><path d="M9 25h7"/><path d="M27 21l9 5"/>'},
  bodyweight:{n:'맨몸',d:'기구 없이 체중으로 하는 운동. 푸시업·스쿼트 등.',
    s:'<circle cx="24" cy="11" r="4"/><path d="M24 15v12"/><path d="M24 20l-7 4"/><path d="M24 20l7 4"/><path d="M24 27l-6 11"/><path d="M24 27l6 11"/>'}
};

const RECO={
  가슴:[
    ['벤치프레스','barbell','바벨 + 플랫 벤치','3세트 8~12회'],
    ['인클라인 덤벨프레스','dumbbell','덤벨 + 인클라인 벤치','3세트 10회'],
    ['케이블 플라이','cable','케이블 머신','3세트 12~15회'],
    ['딥스','dip','평행봉','3세트 8~10회'],
    ['푸시업','bodyweight','맨몸','3세트 15회']
  ],
  등:[
    ['랫풀다운','latpull','랫풀다운 머신','3세트 10~12회'],
    ['바벨 로우','barbell','바벨','3세트 8~12회'],
    ['시티드 로우','row','시티드 로우 머신','3세트 12회'],
    ['풀업','pullup','풀업 바','3세트 6~10회'],
    ['원암 덤벨로우','dumbbell','덤벨 + 플랫 벤치','3세트 12회']
  ],
  하체:[
    ['스쿼트','rack','스쿼트 랙 + 바벨','3세트 8~12회'],
    ['레그프레스','legpress','레그프레스 머신','3세트 12회'],
    ['런지','dumbbell','덤벨(없어도 됨)','3세트 10회'],
    ['레그컬','legcurl','레그컬 머신','3세트 12~15회'],
    ['카프레이즈','machine','웨이트 머신(또는 맨몸)','3세트 15~20회']
  ],
  어깨:[
    ['숄더프레스','dumbbell','덤벨 + 인클라인 벤치','3세트 8~12회'],
    ['사이드 레터럴 레이즈','dumbbell','덤벨','3세트 12~15회'],
    ['페이스풀','cable','케이블 머신','3세트 15회'],
    ['업라이트 로우','barbell','바벨(또는 케이블)','3세트 12회']
  ],
  팔:[
    ['바벨 컬','barbell','바벨','3세트 10~12회'],
    ['해머 컬','dumbbell','덤벨','3세트 12회'],
    ['트라이셉스 푸시다운','cable','케이블 머신','3세트 12~15회'],
    ['오버헤드 익스텐션','dumbbell','덤벨','3세트 12회']
  ],
  복부:[
    ['플랭크','bodyweight','맨몸','3세트 40초'],
    ['크런치','bodyweight','맨몸','3세트 20회'],
    ['레그레이즈','bodyweight','맨몸','3세트 12회'],
    ['데드버그','bodyweight','맨몸','3세트 10회']
  ],
  유산소:[
    ['빠르게 걷기','treadmill','트레드밀','20~30분'],
    ['실내 사이클','bike','실내 사이클','20분 중간 강도'],
    ['로잉머신','rower','로잉머신','15분']
  ]
};

let data=JSON.parse(localStorage.getItem(KEY)||'[]');
let part='가슴';

const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const todayStr=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const wd=['일','월','화','수','목','금','토'];
const icon=(k,cls)=>'<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+((EQUIP[k]||{}).s||'')+'</svg>';

/* 기구 사진(240x240 실제 사진) 경로 */
for(const k in EQUIP){EQUIP[k].img='images/'+k+'.png';}

/* 내 운동 — 사용자가 직접 지정한 종목: [종목명, 기구key, 세트·횟수, (선택)기구 표기] */
const MY_FAV=[
  ['딥스','dip','3세트 8~10회'],
  ['랫풀다운','latpull','3세트 10~12회'],
  ['풀업','pullup','3세트 6~10회'],
  ['바벨 오버헤드 프레스','barbell','3세트 8~10회'],
  ['숄더프레스 머신','machine','3세트 10~12회'],
  ['시티드 로우','row','3세트 10~12회'],
  ['벤치프레스','bench','3세트 8~12회','바벨 + 플랫 벤치']
];

/* 종목명 → 기구key / 부위 (색상용) */
const EX_EQ={},EX_PART={};
Object.keys(RECO).forEach(p=>RECO[p].forEach(([n,eq])=>{EX_EQ[n]=eq;EX_PART[n]=p;}));
function eqOf(name){
  if(EX_EQ[name])return EX_EQ[name];
  for(const k in EQUIP){if(name.indexOf(EQUIP[k].n)>=0)return k;}
  return null;
}
function partOf(name,fallback){
  if(EX_PART[name])return EX_PART[name];
  const eq=eqOf(name);
  for(const p in RECO){if(RECO[p].some(r=>r[1]===eq&&r[0]===name))return p;}
  return fallback||part;
}

function save(){localStorage.setItem(KEY,JSON.stringify(data));}

function initToday(){
  const d=new Date();
  $('today').textContent=d.getMonth()+1+'월 '+d.getDate()+'일 '+wd[d.getDay()]+'요일';
}
function markChips(){
  [...$('partChips').children].forEach(c=>c.classList.toggle('on',c.dataset.p===part));
  paintColor($('recoCard'),part);
  $('recoLabel').textContent=part+' 추천';
  $('recoLabel').parentElement.style.setProperty('--c',PC(part).c);
  $('formPart').textContent=part;
  $('formPart').style.color=PC(part).cd;
}
function initChips(){
  const box=$('partChips');
  PARTS.forEach(p=>{
    const b=document.createElement('button');
    b.className='chip'+(p===part?' on':'');
    b.dataset.p=p;
    paintColor(b,p);
    b.innerHTML='<i></i>'+p;
    b.onclick=()=>{part=p;markChips();renderReco();};
    box.appendChild(b);
  });
}
function renderReco(){
  markChips();

  /* 내 운동 — 부위와 상관없이 항상 */
  $('favWrap').classList.toggle('hide',!MY_FAV.length);
  const favBox=$('favBox');favBox.innerHTML='';
  MY_FAV.forEach(([name,eq,sets,label])=>favBox.appendChild(favRow(name,eq,sets,label)));

  /* 내 기록에서 — 많이 한 순서 상위 5개 */
  const mine=myTop(5);
  $('mineWrap').classList.toggle('hide',!mine.length);
  $('mineBox').innerHTML=mine.map(([name,eq])=>'<button class="mrow" data-ex="'+name.replace(/"/g,'')+'" style="--c:'+PC(partOf(name)).c+'">'
    +(eq?'<img src="'+EQUIP[eq].img+'" alt="">':'')+'<span>'+name+'</span></button>').join('');
  $('mineBox').querySelectorAll('.mrow').forEach(b=>b.onclick=()=>{
    const n=b.dataset.ex;fillExercise(n,eqOf(n));
  });

  /* 부위별 추천 */
  const box=$('recoBox');
  box.innerHTML='';
  const list=RECO[part]||[];
  $('recoCount').textContent=list.length+'종목';
  if(!list.length){box.innerHTML='<div class="hint">이 부위 추천은 준비 중이에요.</div>';return;}
  list.forEach(([name,eq,desc,sets])=>box.appendChild(recoRow(name,eq,sets,desc)));
}
function recoRow(name,eq,sets,label){
  const e=EQUIP[eq]||{};
  const b=document.createElement('button');
  b.innerHTML=(e.img?'<img class="thumb" src="'+e.img+'" alt="">':icon(eq))
    +'<div class="txt"><b>'+name+'</b><small>'+(label||e.n||'')+' · '+sets+'</small></div>'
    +'<span class="plus">+</span>';
  b.onclick=()=>fillExercise(name,eq);
  return b;
}
function favRow(name,eq,sets,label){
  const e=EQUIP[eq]||{};
  const b=document.createElement('button');
  b.className='fav';
  b.style.setProperty('--c',PC(partOf(name)).c);
  b.innerHTML=(e.img?'<img src="'+e.img+'" alt="">':icon(eq))
    +'<div class="t"><b>'+name+'</b><small>'+sets+'</small></div>';
  b.onclick=()=>fillExercise(name,eq);
  return b;
}
function myTop(n){
  const agg={};
  data.forEach(x=>{const a=agg[x.ex]||(agg[x.ex]={c:0,last:''});a.c++;if(x.date>a.last)a.last=x.date;});
  return Object.keys(agg).sort((a,b)=>agg[b].c-agg[a].c||(agg[a].last<agg[b].last?1:-1))
    .slice(0,n).map(name=>[name,eqOf(name)]);
}
function fillExercise(name,eq){
  $('ex').value=name;
  if(EX_PART[name]){part=EX_PART[name];markChips();}
  const l=lastOf(name);
  const eqLine=eq&&EQUIP[eq]?('기구: '+EQUIP[eq].n+' — '+EQUIP[eq].d+' '):'';
  $('lastHint').textContent=eqLine+(l?('지난 기록: '+l.w+'kg × '+l.r+'회 × '+l.s+'세트 ('+l.date+')'):'처음이면 12회 가능한 무게부터.');
  const card=$('formCard');
  if(card){
    card.classList.remove('flash');
    void card.offsetWidth;
    card.classList.add('flash');
    card.scrollIntoView({behavior:'smooth',block:'center'});
  }
  $('w').focus({preventScroll:true});
}
function refreshExList(){
  const names=[...new Set(data.map(x=>x.ex))];
  $('exList').innerHTML=names.map(n=>'<option value="'+n.replace(/"/g,'')+'">').join('');
}
function lastOf(name){
  const rows=data.filter(x=>x.ex===name).sort((a,b)=>(a.date<b.date?1:-1));
  return rows[0];
}
function addItem(){
  const ex=$('ex').value.trim();
  const w=parseFloat($('w').value), r=parseInt($('r').value), s=parseInt($('s').value)||1;
  if(!ex){alert('종목을 적어 주세요.');return;}
  if(!(w>=0)||!(r>0)){alert('무게와 횟수를 숫자로 적어 주세요.');return;}
  data.push({id:Date.now()+''+Math.floor(Math.random()*99),date:todayStr(),part,ex,w,r,s,m:$('m').value.trim()});
  save();refreshExList();render();renderReco();
  $('ex').value='';$('w').value='';$('r').value='';$('s').value='';$('m').value='';
  const l=lastOf(ex);
  $('lastHint').textContent=l?('「'+ex+'」 지난 기록: '+l.w+'kg × '+l.r+'회 × '+l.s+'세트 ('+l.date+')'):'';
  $('ex').focus();
}
function render(){
  const box=$('list');
  if(!data.length){box.innerHTML='<div class="empty">아직 기록이 없어요.<br>오늘 운동한 종목부터 하나씩 쌓아 보세요.</div>';return;}
  const byDate={};
  data.forEach(x=>{(byDate[x.date]=byDate[x.date]||[]).push(x);});
  const dates=Object.keys(byDate).sort().reverse();
  let html='';
  dates.forEach(d=>{
    const rows=byDate[d];
    const vol=rows.reduce((a,x)=>a+x.w*x.r*x.s,0);
    const dd=new Date(d+'T00:00:00');
    html+='<div class="day"><span>'+d+' '+wd[dd.getDay()]+'</span><span>'+won(vol)+'kg</span></div><div class="card" style="padding:2px 14px">';
    rows.forEach(x=>{
      const k=PC(x.part);
      html+='<div class="item"><div class="name"><b>'+x.ex+'</b><small><span class="ptag" style="--cl:'+k.cl+';--cd:'+k.cd+'">'+x.part+'</span>'
        +x.w+'kg × '+x.r+'회 × '+x.s+'세트'+(x.m?' · '+x.m:'')+'</small></div>'
        +'<div class="vol">'+won(x.w*x.r*x.s)+'</div><button class="del" data-id="'+x.id+'">×</button></div>';
    });
    html+='</div>';
  });
  box.innerHTML=html;
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    if(!confirm('이 기록을 지울까요?'))return;
    data=data.filter(x=>x.id!==b.dataset.id);save();render();renderReco();
  });
}
function weekStart(offset){
  const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day-(offset||0)*7);d.setHours(0,0,0,0);return d;
}
function renderStat(){
  const ws=weekStart(0).getTime();
  const wk=data.filter(x=>new Date(x.date+'T00:00:00').getTime()>=ws);
  $('sWeek').textContent=won(wk.reduce((a,x)=>a+x.w*x.r*x.s,0))+'kg';
  $('sDays').textContent=new Set(wk.map(x=>x.date)).size+'일';

  const from=Date.now()-30*864e5;
  const recent=data.filter(x=>new Date(x.date+'T00:00:00').getTime()>=from);
  const pm={};recent.forEach(x=>{pm[x.part]=(pm[x.part]||0)+x.w*x.r*x.s;});
  const max=Math.max(1,...Object.values(pm));
  $('partStat').innerHTML=Object.keys(pm).length?Object.entries(pm).sort((a,b)=>b[1]-a[1]).map(([p,v])=>
    '<div class="part" style="--c:'+PC(p).c+'"><div class="top"><span><i class="dotr"></i>'+p+'</span><span>'+won(v)+'kg</span></div>'
    +'<div class="bar"><i style="width:'+(v/max*100).toFixed(0)+'%;background:'+PC(p).c+'"></i></div></div>').join(''):'<div class="empty">최근 30일 기록이 없어요.</div>';

  let wh='';
  for(let i=5;i>=0;i--){
    const st=weekStart(i).getTime(), en=st+7*864e5;
    const v=data.filter(x=>{const t=new Date(x.date+'T00:00:00').getTime();return t>=st&&t<en;}).reduce((a,x)=>a+x.w*x.r*x.s,0);
    wh+='<div class="part"><div class="top"><span>'+(i===0?'이번 주':(i+'주 전'))+'</span><span>'+won(v)+'kg</span></div>'
      +'<div class="bar"><i style="width:'+Math.min(100,v/Math.max(1,20000)*100).toFixed(0)+'%;background:linear-gradient(90deg,#8b6cf6,#5a45e8)"></i></div></div>';
  }
  $('weekStat').innerHTML=wh;

  const pr={},prp={};data.forEach(x=>{if(!pr[x.ex]||x.w>pr[x.ex]){pr[x.ex]=x.w;prp[x.ex]=x.part;}});
  $('prStat').innerHTML=Object.keys(pr).length?Object.entries(pr).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([e,v])=>
    '<div class="item"><div class="name"><b>'+e+'</b><small><span class="dotr" style="--c:'+PC(prp[e]).c+'"></span>'+prp[e]+'</small></div>'
    +'<div class="vol">'+v+'kg</div></div>').join(''):'<div class="empty">기록이 쌓이면 최고 무게가 보여요.</div>';
}
function exportFile(){
  if(!data.length){alert('내보낼 기록이 없어요.');return;}
  let csv='날짜,부위,종목,무게,횟수,세트,볼륨,메모\n';
  data.slice().sort((a,b)=>(a.date<b.date?-1:1)).forEach(x=>{
    csv+=[x.date,x.part,x.ex,x.w,x.r,x.s,x.w*x.r*x.s,(x.m||'').replace(/,/g,' ')].join(',')+'\n';
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='운동일지_'+todayStr()+'.csv';a.click();
}
$('save').onclick=addItem;
$('tabWrite').onclick=()=>{$('tabWrite').classList.add('on');$('tabStat').classList.remove('on');$('viewWrite').classList.remove('hide');$('viewStat').classList.add('hide');};
$('tabStat').onclick=()=>{$('tabStat').classList.add('on');$('tabWrite').classList.remove('on');$('viewStat').classList.remove('hide');$('viewWrite').classList.add('hide');renderStat();};
$('exportBtn').onclick=e=>{e.preventDefault();exportFile();};
$('ex').addEventListener('input',()=>{
  const l=lastOf($('ex').value.trim());
  $('lastHint').textContent=l?('지난 기록: '+l.w+'kg × '+l.r+'회 × '+l.s+'세트 ('+l.date+')'):'';
});
initToday();initChips();renderReco();refreshExList();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
