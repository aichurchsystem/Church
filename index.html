<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동일지</title>
<meta name="theme-color" content="#12151b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#12151b; --card:#1b202a; --line:#2a3140; --text:#eef1f6; --dim:#9aa4b5;
    --accent:#e9b44c; --accent2:#5cc9a7; --danger:#e2667a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    padding-bottom:88px}
  header{padding:18px 16px 10px;position:sticky;top:0;background:linear-gradient(180deg,#12151b 70%,rgba(18,21,27,.88));z-index:5}
  h1{font-size:19px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:4px}
  .wrap{padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .row{display:flex;gap:10px}
  .row > *{flex:1;min-width:0}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px 2px}
  input,select,textarea,button{font:inherit;color:var(--text)}
  input,select,textarea{width:100%;background:#141922;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px}
  .chip{flex:0 0 auto;background:#141922;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--dim)}
  .chip.on{background:rgba(233,180,76,.15);border-color:var(--accent);color:var(--accent)}
  .btn{width:100%;padding:15px;border:0;border-radius:13px;background:var(--accent);color:#1a1408;font-weight:700;font-size:16px}
  .btn:active{opacity:.85}
  .tabs{display:flex;background:#141922;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;background:none;border:0;padding:10px;border-radius:9px;color:var(--dim);font-size:14px}
  .tabs button.on{background:#232a36;color:var(--text);font-weight:600}
  .stat{display:flex;gap:10px;margin-bottom:12px}
  .stat > div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat b{display:block;font-size:20px;margin-top:4px;letter-spacing:-.4px}
  .stat span{font-size:11.5px;color:var(--dim)}
  .day{margin:16px 0 6px;font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
  .item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .name{flex:1;min-width:0}
  .item .name b{font-weight:600;font-size:15px}
  .item .name small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
  .item .vol{color:var(--accent2);font-size:13px;white-space:nowrap}
  .del{background:none;border:0;color:#586174;font-size:18px;padding:4px 2px}
  .empty{color:var(--dim);font-size:13.5px;text-align:center;padding:26px 8px;line-height:1.7}
  .bar{height:9px;background:#141922;border-radius:6px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .part{margin-bottom:13px}
  .part .top{display:flex;justify-content:space-between;font-size:13px}
  .part .top span:last-child{color:var(--dim)}
  .hint{font-size:12px;color:var(--dim);margin:8px 2px 0;line-height:1.6}
  .footnote{font-size:11.5px;color:#586174;text-align:center;margin:20px 0 8px}
  a.link{color:var(--accent2);text-decoration:none;font-size:13px}
  .hide{display:none}
  .recohead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .recohead b{font-size:13.5px}
  .recohead span{font-size:11.5px;color:var(--dim)}
  .reco{display:flex;flex-direction:column;gap:8px}
  .reco button{display:flex;gap:10px;align-items:center;width:100%;background:#141922;border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:left;line-height:1.35}
  .reco button:active{border-color:var(--accent);background:rgba(233,180,76,.12)}
  .reco .txt{flex:1;min-width:0}
  .reco .txt b{display:block;font-size:14px;font-weight:600}
  .reco .txt small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
  .ico{width:22px;height:22px;flex:0 0 auto;color:var(--accent2)}
  .ico.big{width:38px;height:38px;color:var(--accent)}
  .eqgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .eqi{background:#141922;border:1px solid var(--line);border-radius:12px;padding:10px}
  .eqi b{display:block;font-size:12.5px;margin-top:6px;font-weight:600}
  .eqi small{display:block;color:var(--dim);font-size:11px;line-height:1.45;margin-top:3px}
</style>
</head>
<body>
<header>
  <h1>운동일지</h1>
  <div class="sub" id="today"></div>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="tabWrite" class="on">기록하기</button>
    <button id="tabStat">통계</button>
  </div>

  <!-- 기록 -->
  <section id="viewWrite">
    <div class="card">
      <div class="chips" id="partChips"></div>
      <div class="row" style="margin-bottom:10px">
        <div>
          <label>종목</label>
          <input id="ex" list="exList" placeholder="벤치프레스" autocomplete="off">
          <datalist id="exList"></datalist>
        </div>
      </div>
      <div class="row" style="margin-bottom:10px">
        <div><label>무게(kg)</label><input id="w" type="number" inputmode="decimal" step="0.5" placeholder="40"></div>
        <div><label>횟수</label><input id="r" type="number" inputmode="numeric" placeholder="10"></div>
        <div><label>세트</label><input id="s" type="number" inputmode="numeric" placeholder="3"></div>
      </div>
      <div style="margin-bottom:12px">
        <label>메모 (선택)</label>
        <input id="m" placeholder="컨디션, 자세 등">
      </div>
      <button class="btn" id="save">저장</button>
      <div class="hint" id="lastHint"></div>
    </div>

    <div class="card">
      <div class="recohead"><b>추천 종목</b><span id="recoPart">가슴</span></div>
      <div class="reco" id="recoBox"></div>
      <div class="hint" style="margin-top:11px">종목을 누르면 위 칸에 채워집니다. 무게는 지난 기록 보시고 맞춰 올리세요.</div>
    </div>

    <div class="card">
      <div class="recohead"><b>기구 사전</b><span>그림으로 보기</span></div>
      <div class="eqgrid" id="eqGrid"></div>
    </div>

    <div id="list"></div>
    <div class="footnote">기록은 이 폰에만 저장됩니다 · <a class="link" href="#" id="exportBtn">파일로 내보내기</a></div>
  </section>

  <!-- 통계 -->
  <section id="viewStat" class="hide">
    <div class="stat">
      <div><span>이번 주 볼륨</span><b id="sWeek">0</b></div>
      <div><span>이번 주 운동일</span><b id="sDays">0</b></div>
    </div>
    <div class="card">
      <div style="font-size:13.5px;font-weight:600;margin-bottom:12px">부위별 볼륨 (최근 30일)</div>
      <div id="partStat"></div>
    </div>
    <div class="card">
      <div style="font-size:13.5px;font-weight:600;margin-bottom:12px">최근 6주</div>
      <div id="weekStat"></div>
    </div>
    <div class="card">
      <div style="font-size:13.5px;font-weight:600;margin-bottom:12px">종목별 최고 무게</div>
      <div id="prStat"></div>
    </div>
  </section>
</div>

<script>
const KEY='workoutlog.v1';
const PARTS=['가슴','등','하체','어깨','팔','복부','유산소'];

/* ── 기구 사전: 이름, 모양 설명, 그림(선 도해) ── */
const EQUIP={
  barbell:{n:'바벨',d:'양쪽에 원판을 끼우는 긴 쇠막대. 봉만 보통 20kg.',
    s:'<path d="M7 24h34"/><rect x="9" y="15" width="5" height="18" rx="1.6"/><rect x="34" y="15" width="5" height="18" rx="1.6"/>'},
  dumbbell:{n:'덤벨',d:'한 손에 하나씩 드는 짧은 막대. 양 끝에 무게 뭉치.',
    s:'<path d="M19 24h10"/><rect x="10" y="16" width="6" height="16" rx="2"/><rect x="32" y="16" width="6" height="16" rx="2"/>'},
  bench:{n:'플랫 벤치',d:'바닥에 누워 쓰는 평평한 의자. 등받이 각도 없음.',
    s:'<path d="M8 25h32"/><path d="M15 25v9"/><path d="M33 25v9"/><path d="M10 34h10"/><path d="M28 34h10"/>'},
  incline:{n:'인클라인 벤치',d:'등받이가 30~45도로 올라간 벤치. 윗가슴 운동에 씀.',
    s:'<path d="M11 34l9-17"/><path d="M24 31h14"/><path d="M18 31v7"/><path d="M33 31v7"/>'},
  rack:{n:'스쿼트 랙',d:'바벨을 걸어 두는 두 기둥 틀. 서서 스쿼트할 때 씀.',
    s:'<path d="M14 41V7"/><path d="M34 41V7"/><path d="M14 17h20"/><path d="M17 17v5"/><path d="M31 17v5"/>'},
  cable:{n:'케이블 머신',d:'도르래에 줄이 달린 기둥 기구. 손잡이를 당겨 씀.',
    s:'<rect x="9" y="8" width="9" height="32" rx="2"/><circle cx="20" cy="14" r="2.4"/><path d="M22.4 14H32"/><path d="M32 14v12"/><path d="M28 26h8"/>'},
  latpull:{n:'랫풀다운',d:'머리 위 긴 바를 아래로 당기는 기구. 앉아서 함.',
    s:'<path d="M12 41V8h24"/><path d="M16 13h16"/><path d="M16 13v4"/><path d="M32 13v4"/><path d="M19 32h10"/>'},
  row:{n:'시티드 로우',d:'앉아서 가슴 쪽으로 손잡이를 당기는 기구.',
    s:'<rect x="7" y="28" width="13" height="7" rx="2"/><path d="M20 31.5h7"/><circle cx="30" cy="31.5" r="2.6"/><path d="M30 29V18"/><path d="M23 18h14"/>'},
  legpress:{n:'레그프레스',d:'앉아서 두 발로 판을 앞으로 미는 기구. 하체 전체.',
    s:'<path d="M8 41V28a2 2 0 012-2h8v7"/><path d="M18 25h9"/><path d="M35 11l-6 26"/><path d="M40 13l-6 26"/>'},
  legcurl:{n:'레그컬',d:'앉거나 엎드려 다리 뒤꿈치를 말아 올리는 기구.',
    s:'<path d="M6 22h19"/><path d="M10 22v10"/><path d="M19 22v10"/><path d="M25 22h9"/><circle cx="34" cy="28" r="5"/>'},
  dip:{n:'평행봉',d:'두 개의 평행한 봉. 팔로 몸을 지지하고 내려갔다 올라옴.',
    s:'<path d="M12 41V15"/><path d="M12 15h8"/><path d="M28 15h8"/><path d="M36 41V15"/>'},
  pullup:{n:'풀업 바',d:'머리 위 가로 막대. 매달려 몸을 끌어올림.',
    s:'<path d="M6 15h36"/><path d="M11 7v8"/><path d="M37 7v8"/><path d="M18 15v6"/><path d="M30 15v6"/>'},
  machine:{n:'웨이트 머신',d:'무게추가 쌓인 기구. 핀을 꽂아 무게를 정함.',
    s:'<rect x="9" y="7" width="10" height="34" rx="2"/><path d="M11 14h6"/><path d="M11 20h6"/><path d="M11 26h6"/><path d="M22 33h13"/><path d="M28 33v5"/>'},
  treadmill:{n:'트레드밀',d:'돌아가는 벨트 위를 걷거나 뛰는 기구. 속도 조절 가능.',
    s:'<path d="M7 36h22l8-6"/><path d="M30 30h9"/><path d="M35 30V16"/><path d="M30 16h10"/><path d="M11 36v5"/><path d="M26 36v5"/>'},
  bike:{n:'실내 사이클',d:'앉아서 페달을 밟는 자전거. 무릎 부담이 적음.',
    s:'<circle cx="15" cy="33" r="6.5"/><circle cx="35" cy="33" r="6.5"/><path d="M15 33l7-13h8l5 13"/><path d="M22 20h7"/><path d="M30 20l-4-6"/>'},
  rower:{n:'로잉머신',d:'노젓듯 앉아서 손잡이를 당기는 기구. 전신 운동.',
    s:'<path d="M6 38h36"/><rect x="14" y="31" width="11" height="5" rx="2"/><path d="M9 34v-9"/><path d="M9 25h7"/><path d="M27 21l9 5"/>'},
  bodyweight:{n:'맨몸',d:'기구 없이 체중으로 하는 운동. 푸시업·스쿼트 등.',
    s:'<circle cx="24" cy="11" r="4"/><path d="M24 15v12"/><path d="M24 20l-7 4"/><path d="M24 20l7 4"/><path d="M24 27l-6 11"/><path d="M24 27l6 11"/>'}
};

const RECO={
  가슴:[
    ['벤치프레스','barbell','바벨 + 플랫 벤치','3세트 8~12회'],
    ['인클라인 덤벨프레스','dumbbell','덤벨 + 인클라인 벤치','3세트 10회'],
    ['케이블 플라이','cable','케이블 머신','3세트 12~15회'],
    ['딥스','dip','평행봉','3세트 8~10회'],
    ['푸시업','bodyweight','맨몸','3세트 15회']
  ],
  등:[
    ['랫풀다운','latpull','랫풀다운 머신','3세트 10~12회'],
    ['바벨 로우','barbell','바벨','3세트 8~12회'],
    ['시티드 로우','row','시티드 로우 머신','3세트 12회'],
    ['풀업','pullup','풀업 바','3세트 6~10회'],
    ['원암 덤벨로우','dumbbell','덤벨 + 플랫 벤치','3세트 12회']
  ],
  하체:[
    ['스쿼트','rack','스쿼트 랙 + 바벨','3세트 8~12회'],
    ['레그프레스','legpress','레그프레스 머신','3세트 12회'],
    ['런지','dumbbell','덤벨(없어도 됨)','3세트 10회'],
    ['레그컬','legcurl','레그컬 머신','3세트 12~15회'],
    ['카프레이즈','machine','웨이트 머신(또는 맨몸)','3세트 15~20회']
  ],
  어깨:[
    ['숄더프레스','dumbbell','덤벨 + 인클라인 벤치','3세트 8~12회'],
    ['사이드 레터럴 레이즈','dumbbell','덤벨','3세트 12~15회'],
    ['페이스풀','cable','케이블 머신','3세트 15회'],
    ['업라이트 로우','barbell','바벨(또는 케이블)','3세트 12회']
  ],
  팔:[
    ['바벨 컬','barbell','바벨','3세트 10~12회'],
    ['해머 컬','dumbbell','덤벨','3세트 12회'],
    ['트라이셉스 푸시다운','cable','케이블 머신','3세트 12~15회'],
    ['오버헤드 익스텐션','dumbbell','덤벨','3세트 12회']
  ],
  복부:[
    ['플랭크','bodyweight','맨몸','3세트 40초'],
    ['크런치','bodyweight','맨몸','3세트 20회'],
    ['레그레이즈','bodyweight','맨몸','3세트 12회'],
    ['데드버그','bodyweight','맨몸','3세트 10회']
  ],
  유산소:[
    ['빠르게 걷기','treadmill','트레드밀','20~30분'],
    ['실내 사이클','bike','실내 사이클','20분 중간 강도'],
    ['로잉머신','rower','로잉머신','15분']
  ]
};

let data=JSON.parse(localStorage.getItem(KEY)||'[]');
let part='가슴';

const $=id=>document.getElementById(id);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const todayStr=()=>{const d=new Date();const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const wd=['일','월','화','수','목','금','토'];
const icon=(k,cls)=>'<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+((EQUIP[k]||{}).s||'')+'</svg>';

function save(){localStorage.setItem(KEY,JSON.stringify(data));}

function initToday(){
  const d=new Date();
  $('today').textContent=d.getMonth()+1+'월 '+d.getDate()+'일 '+wd[d.getDay()]+'요일';
}
function initChips(){
  const box=$('partChips');
  PARTS.forEach(p=>{
    const b=document.createElement('button');
    b.className='chip'+(p===part?' on':'');
    b.textContent=p;
    b.onclick=()=>{part=p;[...box.children].forEach(c=>c.classList.toggle('on',c.textContent===p));renderReco();};
    box.appendChild(b);
  });
}
function renderReco(){
  $('recoPart').textContent=part;
  const box=$('recoBox');
  box.innerHTML='';
  const list=RECO[part]||[];
  if(!list.length){box.innerHTML='<div class="hint">이 부위 추천은 준비 중이에요.</div>';return;}
  list.forEach(([name,eq,sets])=>{
    const b=document.createElement('button');
    b.innerHTML=icon(eq)+'<div class="txt"><b>'+name+'</b><small>'+EQUIP[eq].n+' · '+sets+'</small></div>';
    b.onclick=()=>fillExercise(name,eq);
    box.appendChild(b);
  });
}
function renderEq(){
  $('eqGrid').innerHTML=Object.keys(EQUIP).map(k=>
    '<div class="eqi">'+icon(k,'big')+'<b>'+EQUIP[k].n+'</b><small>'+EQUIP[k].d+'</small></div>').join('');
}
function fillExercise(name,eq){
  $('ex').value=name;
  const l=lastOf(name);
  const eqLine=eq&&EQUIP[eq]?('기구: '+EQUIP[eq].n+' — '+EQUIP[eq].d+' '):'';
  $('lastHint').textContent=eqLine+(l?('지난 기록: '+l.w+'kg × '+l.r+'회 × '+l.s+'세트 ('+l.date+')'):'처음이면 12회 가능한 무게부터.');
  $('w').focus();
}
function refreshExList(){
  const names=[...new Set(data.map(x=>x.ex))];
  $('exList').innerHTML=names.map(n=>'<option value="'+n.replace(/"/g,'')+'">').join('');
}
function lastOf(name){
  const rows=data.filter(x=>x.ex===name).sort((a,b)=>(a.date<b.date?1:-1));
  return rows[0];
}
function addItem(){
  const ex=$('ex').value.trim();
  const w=parseFloat($('w').value), r=parseInt($('r').value), s=parseInt($('s').value)||1;
  if(!ex){alert('종목을 적어 주세요.');return;}
  if(!(w>=0)||!(r>0)){alert('무게와 횟수를 숫자로 적어 주세요.');return;}
  data.push({id:Date.now()+''+Math.floor(Math.random()*99),date:todayStr(),part,ex,w,r,s,m:$('m').value.trim()});
  save();refreshExList();render();
  $('ex').value='';$('w').value='';$('r').value='';$('s').value='';$('m').value='';
  const l=lastOf(ex);
  $('lastHint').textContent=l?('「'+ex+'」 지난 기록: '+l.w+'kg × '+l.r+'회 × '+l.s+'세트 ('+l.date+')'):'';
  $('ex').focus();
}
function render(){
  const box=$('list');
  if(!data.length){box.innerHTML='<div class="empty">아직 기록이 없어요.<br>오늘 운동한 종목부터 하나씩 쌓아 보세요.</div>';return;}
  const byDate={};
  data.forEach(x=>{(byDate[x.date]=byDate[x.date]||[]).push(x);});
  const dates=Object.keys(byDate).sort().reverse();
  let html='';
  dates.forEach(d=>{
    const rows=byDate[d];
    const vol=rows.reduce((a,x)=>a+x.w*x.r*x.s,0);
    const dd=new Date(d+'T00:00:00');
    html+='<div class="day"><span>'+d+' '+wd[dd.getDay()]+'</span><span>'+won(vol)+'kg</span></div><div class="card" style="padding:4px 14px">';
    rows.forEach(x=>{
      html+='<div class="item"><div class="name"><b>'+x.ex+'</b><small>'+x.part+' · '+x.w+'kg × '+x.r+'회 × '+x.s+'세트'+(x.m?' · '+x.m:'')+'</small></div>'
        +'<div class="vol">'+won(x.w*x.r*x.s)+'</div><button class="del" data-id="'+x.id+'">×</button></div>';
    });
    html+='</div>';
  });
  box.innerHTML=html;
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    if(!confirm('이 기록을 지울까요?'))return;
    data=data.filter(x=>x.id!==b.dataset.id);save();render();
  });
}
function weekStart(offset){
  const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day-(offset||0)*7);d.setHours(0,0,0,0);return d;
}
function renderStat(){
  const ws=weekStart(0).getTime();
  const wk=data.filter(x=>new Date(x.date+'T00:00:00').getTime()>=ws);
  $('sWeek').textContent=won(wk.reduce((a,x)=>a+x.w*x.r*x.s,0))+'kg';
  $('sDays').textContent=new Set(wk.map(x=>x.date)).size+'일';

  const from=Date.now()-30*864e5;
  const recent=data.filter(x=>new Date(x.date+'T00:00:00').getTime()>=from);
  const pm={};recent.forEach(x=>{pm[x.part]=(pm[x.part]||0)+x.w*x.r*x.s;});
  const max=Math.max(1,...Object.values(pm));
  $('partStat').innerHTML=Object.keys(pm).length?Object.entries(pm).sort((a,b)=>b[1]-a[1]).map(([p,v])=>
    '<div class="part"><div class="top"><span>'+p+'</span><span>'+won(v)+'kg</span></div><div class="bar"><i style="width:'+(v/max*100).toFixed(0)+'%"></i></div></div>').join(''):'<div class="empty">최근 30일 기록이 없어요.</div>';

  let wh='';
  for(let i=5;i>=0;i--){
    const st=weekStart(i).getTime(), en=st+7*864e5;
    const v=data.filter(x=>{const t=new Date(x.date+'T00:00:00').getTime();return t>=st&&t<en;}).reduce((a,x)=>a+x.w*x.r*x.s,0);
    wh+='<div class="part"><div class="top"><span>'+(i===0?'이번 주':(i+'주 전'))+'</span><span>'+won(v)+'kg</span></div><div class="bar"><i style="width:'+Math.min(100,v/Math.max(1,20000)*100).toFixed(0)+'%"></i></div></div>';
  }
  $('weekStat').innerHTML=wh;

  const pr={};data.forEach(x=>{if(!pr[x.ex]||x.w>pr[x.ex])pr[x.ex]=x.w;});
  $('prStat').innerHTML=Object.keys(pr).length?Object.entries(pr).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([e,v])=>
    '<div class="item"><div class="name"><b>'+e+'</b></div><div class="vol">'+v+'kg</div></div>').join(''):'<div class="empty">기록이 쌓이면 최고 무게가 보여요.</div>';
}
function exportFile(){
  if(!data.length){alert('내보낼 기록이 없어요.');return;}
  let csv='날짜,부위,종목,무게,횟수,세트,볼륨,메모\n';
  data.slice().sort((a,b)=>(a.date<b.date?-1:1)).forEach(x=>{
    csv+=[x.date,x.part,x.ex,x.w,x.r,x.s,x.w*x.r*x.s,(x.m||'').replace(/,/g,' ')].join(',')+'\n';
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='운동일지_'+todayStr()+'.csv';a.click();
}
$('save').onclick=addItem;
$('tabWrite').onclick=()=>{$('tabWrite').classList.add('on');$('tabStat').classList.remove('on');$('viewWrite').classList.remove('hide');$('viewStat').classList.add('hide');};
$('tabStat').onclick=()=>{$('tabStat').classList.add('on');$('tabWrite').classList.remove('on');$('viewStat').classList.remove('hide');$('viewWrite').classList.add('hide');renderStat();};
$('exportBtn').onclick=e=>{e.preventDefault();exportFile();};
$('ex').addEventListener('input',()=>{
  const l=lastOf($('ex').value.trim());
  $('lastHint').textContent=l?('지난 기록: '+l.w+'kg × '+l.r+'회 × '+l.s+'세트 ('+l.date+')'):'';
});
initToday();initChips();renderReco();renderEq();refreshExList();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
