<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동일지</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e5e9f2; --line2:#eef1f7;
    --text:#141926; --dim:#69718a; --faint:#666e85;
    --brand:#5a45e8; --brand2:#8b6cf6; --danger:#d33b46;
    --sh:0 1px 2px rgba(20,25,38,.05), 0 5px 16px rgba(20,25,38,.05);
    --c:#f0564a; --cd:#c9342a; --cl:#ffedea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    padding-bottom:88px}
  header{padding:20px 16px 12px;position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 1px 0 var(--line)}
  header:before{content:'';position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,#f0564a,#f59b2e,#2fb45e,#0fb39c,#1fa9e0,#3b82f6,#7b5cf5)}
  h1{font-size:19px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--dim);font-size:12.5px;margin-top:4px}
  .wrap{padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
  .card.flash{animation:flash .9s ease}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(90,69,232,.45)}100%{box-shadow:0 0 0 14px rgba(90,69,232,0)}}
  .row{display:flex;gap:10px}
  .row > *{flex:1;min-width:0}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px 2px}
  input,select,textarea,button{font:inherit;color:var(--text)}
  input,select,textarea{width:100%;background:#f8f9fd;border:1.5px solid #e2e7f1;border-radius:12px;padding:12px;font-size:16px}
  input::placeholder{color:#a7aec0}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);background:#fff}

  /* 부위 칩 */
  .chiplabel{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.2px;margin:0 0 9px 2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:#fff;
    border:1.5px solid var(--line);border-radius:999px;padding:9px 15px 9px 12px;
    font-size:13.5px;font-weight:600;color:#3b4357;line-height:1}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:0 0 auto}
  .chip.on{background:var(--cd);border-color:var(--cd);color:#fff;box-shadow:0 5px 12px rgba(20,25,38,.16)}
  .chip.on i{background:#fff}
  .chip:active{transform:scale(.97)}

  .btn{width:100%;padding:15px;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:16px;
    background:linear-gradient(135deg,#6f5bf7,#4a33d6);box-shadow:0 8px 18px rgba(90,69,232,.28)}
  .btn:active{opacity:.9}

  .tabs{display:flex;background:#e9ecf5;border-radius:14px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;background:none;border:0;padding:10px;border-radius:11px;color:#5c6478;font-size:14px;font-weight:600}
  .tabs button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(20,25,38,.09)}

  .stat{display:flex;gap:10px;margin-bottom:12px}
  .stat > div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--sh)}
  .stat b{display:block;font-size:21px;margin-top:5px;letter-spacing:-.5px;color:var(--brand)}
  .stat .s2 b{color:#0b8b7a}
  .stat span{font-size:11.5px;color:var(--dim)}

  .day{margin:16px 0 7px;font-size:13px;color:#4d5568;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .day span:last-child{color:var(--faint);font-weight:500;font-size:12px}
  .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
  .item:last-child{border-bottom:0}
  .item .name{flex:1;min-width:0}
  .item .name b{font-weight:600;font-size:15px}
  .item .name small{display:block;color:var(--dim);font-size:12px;margin-top:4px}
  .item .vol{color:#4a5568;font-size:13px;font-weight:600;white-space:nowrap}
  .ptag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;
    background:var(--cl);color:var(--cd);margin-right:5px;vertical-align:1px}
  .del{background:none;border:0;color:#7b8398;font-size:19px;padding:4px 2px}
  .empty{color:var(--dim);font-size:13.5px;text-align:center;padding:26px 8px;line-height:1.7}
  .bar{height:9px;background:#eef1f7;border-radius:6px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
  .part{margin-bottom:13px}
  .part:last-child{margin-bottom:2px}
  .part .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
  .part .top span:last-child{color:var(--dim);font-weight:500;font-size:12.5px}
  .dotr{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px}
  .hint{font-size:12px;color:var(--dim);margin:8px 2px 0;line-height:1.6}
  .footnote{font-size:11.5px;color:var(--faint);text-align:center;margin:20px 0 8px}
  a.link{color:var(--brand);text-decoration:none;font-size:12.5px;font-weight:600}
  .hide{display:none}

  .cardhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .cardhead b{font-size:15px;letter-spacing:-.2px}
  .cardhead span{font-size:11.5px;color:var(--faint)}

  /* ── 세트별 무게·횟수 입력 ── */
  .setlist{display:flex;flex-direction:column;gap:7px;margin-bottom:9px}
  .setrow{display:grid;grid-template-columns:42px minmax(0,1fr) 18px minmax(0,1fr) 16px 24px;
    align-items:center;gap:4px}
  .setrow .sn{font-size:11.5px;font-weight:800;color:var(--dim);letter-spacing:-.3px;white-space:nowrap}
  .setrow input{padding:9px 6px;font-size:15px;border-radius:10px;text-align:center}
  .setrow .u{font-size:10.5px;color:var(--faint);font-weight:700}
  .setrow .rm{background:none;border:0;color:#9aa2b6;font-size:18px;line-height:1;padding:2px 0;border-radius:8px}
  .setrow .rm:active{background:#eef1f7;color:var(--danger)}
  .setrow .rm.off{visibility:hidden}
  .addset{width:100%;background:#fff;border:1.5px dashed #cfd6e6;border-radius:11px;padding:10px;
    font-size:13px;font-weight:700;color:var(--brand);display:flex;align-items:center;justify-content:center;gap:5px}
  .addset b{font-size:15px;font-weight:800;line-height:1}
  .addset:active{background:#f4f1ff;border-color:var(--brand2)}
  .volprev{display:flex;align-items:baseline;gap:5px;margin-top:9px;padding:0 2px;font-size:11.5px;color:var(--dim)}
  .volprev b{font-size:14.5px;font-weight:800;color:var(--cd);letter-spacing:-.3px}
  .volprev em{font-style:normal;font-weight:700;color:var(--dim)}

  /* ── 기록 수정 ── */
  #formCard.editing{border-color:#cabfff;box-shadow:0 0 0 3px rgba(90,69,232,.1),var(--sh)}
  .btnrow{display:flex;gap:8px}
  .btnrow .btn{flex:1}
  .btn.ghost{flex:0 0 88px;background:#fff;color:#5c6478;border:1.5px solid var(--line);box-shadow:none}
  .item .rt{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .item .acts{display:flex;align-items:center;gap:1px}
  .btn-edit{background:#f3f1ff;border:1.5px solid #e3ddff;color:var(--brand);border-radius:8px;
    padding:3px 7px;font-size:11px;font-weight:800;line-height:1.3;letter-spacing:-.2px}
  .btn-edit:active{background:#e7e1ff;border-color:var(--brand2)}
  .item .name small{line-height:1.55;word-break:keep-all}
  .lastload{background:none;border:0;padding:0 0 0 2px;color:var(--brand);font-size:12px;font-weight:700;
    text-decoration:underline;text-underline-offset:2px}

  .sec{margin-bottom:14px}
  .seclabel{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.2px;margin:0 0 8px 2px}

  /* 내 운동: 두 칸 압축 목록 */
  .favgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fav{display:flex;align-items:center;gap:8px;min-width:0;background:#fff;border:1.5px solid var(--line);
    border-radius:13px;padding:6px 8px 6px 6px;text-align:left;position:relative;overflow:hidden}
  .fav:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .fav img{width:36px;height:36px;border-radius:10px;object-fit:cover;background:#eceef3;flex:0 0 auto;display:block}
  .fav .t{min-width:0;flex:1}
  .fav b{display:block;font-size:12.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .fav small{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fav:active{background:var(--cl);border-color:var(--c)}

  /* 내 기록에서 */
  .minichips{display:flex;flex-wrap:wrap;gap:7px}
  .mrow{display:flex;align-items:center;gap:7px;background:#f6f7fc;border:1.5px solid var(--line);
    border-radius:999px;padding:4px 12px 4px 4px;font-size:12.5px;font-weight:600;color:#39405250}
  .mrow{color:#394052}
  .mrow img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:#eceef3;display:block}
  .mrow:active{border-color:var(--brand);background:#fff}

  /* 부위 추천 헤더 밴드 */
  .pband{display:flex;align-items:center;gap:8px;background:var(--cl);border-left:4px solid var(--c);
    border-radius:10px;padding:9px 11px;margin:0 0 10px}
  .pband b{font-size:14px;font-weight:800;color:var(--cd);letter-spacing:-.2px}
  .pband span{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--cd);opacity:.75}

  /* 추천 목록 */
  .reco{display:flex;flex-direction:column;gap:9px}
  .reco button{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:#fff;
    border:1.5px solid var(--line);border-radius:14px;padding:9px 11px 9px 9px;font-size:13.5px;
    text-align:left;line-height:1.35;overflow:hidden}
  .reco button:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .reco button:active{background:var(--cl);border-color:var(--c)}
  .reco .txt{flex:1;min-width:0;padding-left:4px}
  .reco .txt b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.2px}
  .reco .txt small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
  .reco .plus{flex:0 0 auto;font-size:15px;font-weight:800;color:var(--cd);opacity:.55;padding-right:2px}
  .thumb{width:52px;height:52px;flex:0 0 auto;border-radius:12px;object-fit:cover;background:#eceef3;display:block}
  .ico{width:22px;height:22px;flex:0 0 auto;color:var(--c)}
  .ico.big{width:38px;height:38px}

  /* ── 홈 ── */
  .tcard{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);
    border-radius:22px;box-shadow:var(--sh);margin-bottom:11px}
  .hero{position:relative;overflow:hidden;padding:14px 14px 13px;color:#fff;
    background:linear-gradient(150deg,var(--cd) 0%,var(--cd) 44%,var(--c) 138%);
    background-size:180% 180%;animation:heroShift 16s ease-in-out infinite;will-change:background-position}
  @keyframes heroShift{0%{background-position:0% 18%}50%{background-position:100% 82%}100%{background-position:0% 18%}}
  .hero:after{content:'';position:absolute;right:-34px;top:-46px;width:158px;height:158px;border-radius:50%;
    background:rgba(255,255,255,.13);pointer-events:none}
  .hrow1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;
    font-weight:700;position:relative;z-index:1}
  .hrow1 span:first-child{letter-spacing:.2px}
  .hrow1 span:last-child{font-weight:600;opacity:.88}
  .hmain{display:flex;align-items:center;gap:8px;margin-top:7px;position:relative;z-index:1}
  .hleft{flex:1;min-width:0}
  .hleft > b{display:block;font-size:29px;font-weight:800;letter-spacing:-1px;line-height:1.1;
    text-shadow:0 1px 3px rgba(20,25,38,.18)}
  .htag{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;padding:3px 8px;
    border-radius:6px;background:rgba(255,255,255,.22)}
  .hsub{margin-top:7px;font-size:12px;font-weight:600;opacity:.96;line-height:1.45}
  .hring{position:relative;width:86px;height:86px;flex:0 0 auto}
  .hring svg.rsvg{display:block;width:86px;height:86px}
  .rtrack{fill:none;stroke:rgba(255,255,255,.3)}
  .rfill{fill:none;stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .95s cubic-bezier(.25,.9,.25,1)}
  .rcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
  .rcenter b{font-size:19px;font-weight:800;letter-spacing:-.5px}
  .rcenter span{font-size:9.5px;font-weight:700;opacity:.88;margin-top:3px}
  .chkpop{width:36px;height:36px;animation:chkPop .6s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes chkPop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .tbody{padding:12px 14px 13px}
  .tcnote{font-size:11px;color:var(--faint);margin:0 0 9px;line-height:1.5}
  .tlist{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
  .hrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fafbff;
    border:1.5px solid var(--line2);border-radius:12px;padding:6px 9px;position:relative;overflow:hidden;
    font:inherit;color:var(--text);line-height:1.35}
  .hrow:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
  .hrow img{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#eceef3;flex:0 0 auto;display:block}
  .hrow .t{flex:1;min-width:0;padding-left:2px}
  .hrow b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow small{display:block;font-size:11px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow:active{background:var(--cl);border-color:var(--c)}
  .hrow .plus2{flex:0 0 auto;font-size:15px;font-weight:800;color:var(--cd);opacity:.5;padding-right:2px}
  .hrow .plus2.ok{opacity:1;font-size:13px;width:19px;height:19px;border-radius:50%;background:var(--cd);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .hrow img,.reco .thumb,.fav img{transition:transform .28s cubic-bezier(.2,.8,.3,1)}
  .hrow:active img,.reco button:active .thumb,.fav:active img{transform:scale(1.12)}
  .reco button,.fav,.hrow,.chip,.hchip{transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease}
  .reco button:active,.fav:active,.hrow:active{transform:scale(.985)}
  .rdate{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--dim);white-space:nowrap}
  .tmore{font-size:11.5px;color:var(--faint);text-align:center;padding:1px 0 0}
  .tbtn{margin-top:2px}
  .hpick{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px}
  .hplabel{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.2px;margin:0 0 6px 2px}
  .hchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 88%,transparent 100%);
    mask-image:linear-gradient(90deg,#000 0,#000 88%,transparent 100%)}
  .hchips::-webkit-scrollbar{display:none}
  .hchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--line);
    border-radius:999px;padding:7px 12px 7px 10px;font-size:12.5px;font-weight:600;color:#3b4357;line-height:1;font-family:inherit}
  .hchip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .hchip.on{background:var(--cd);border-color:var(--cd);color:#fff}
  .hchip.on i{background:#fff}
  .hchip:active{transform:scale(.97)}
  .tcdone{display:flex;align-items:center;gap:11px;margin:12px 0 6px}
  .chk{width:42px;height:42px;border-radius:50%;background:var(--cd);color:#fff;display:flex;align-items:center;
    justify-content:center;flex:0 0 auto;box-shadow:0 6px 14px rgba(20,25,38,.18)}
  .chk svg{width:23px;height:23px;display:block}
  .tcdone b{display:block;font-size:19px;font-weight:800;letter-spacing:-.5px;color:var(--cd);line-height:1.2}
  .tcdone span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px}
  .tcsum{display:flex;align-items:baseline;gap:5px;margin:9px 0 12px;font-size:15.5px;font-weight:800;
    letter-spacing:-.4px;color:#3b4357}
  .tcsum em{font-style:normal;color:var(--cd);font-size:17px}
  .tcsum i{font-style:normal;color:#c3c9d8;font-weight:600;margin:0 1px}
  .wsum{display:flex;gap:8px;margin-bottom:11px}
  .wsum > div{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;
    padding:11px 11px 10px;box-shadow:var(--sh)}
  .wsum span{display:block;font-size:10.5px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wsum b{display:block;font-size:17px;margin-top:5px;letter-spacing:-.6px;color:var(--brand);white-space:nowrap}
  .wsum .w2 b{color:#0b8b7a}
  .wsum .w3 b{color:#9c5705}
  .item.rowflash{animation:rowflash 1.7s ease}
  @keyframes rowflash{0%,55%{box-shadow:inset 0 0 0 999px #eef1f7}100%{box-shadow:inset 0 0 0 999px rgba(238,241,247,0)}}

  /* ── 움직임 ── */
  .btn{transition:transform .12s ease,opacity .15s ease,box-shadow .2s ease}
  .btn.onsave{animation:btnPop .34s ease}
  @keyframes btnPop{0%{transform:scale(1)}42%{transform:scale(.955)}100%{transform:scale(1)}}
  .item.newrow{animation:rowIn .6s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rowIn{0%{opacity:0;transform:translateY(14px)}60%{opacity:1}100%{opacity:1;transform:none}}
  .viewin{animation:viewIn .32s cubic-bezier(.2,.8,.3,1) both}
  @keyframes viewIn{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
  .bar i{transition:width .8s cubic-bezier(.22,.8,.26,1)}
  .wprog{margin:-2px 0 12px;padding:0 2px}
  .wprow{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:600;color:var(--dim);margin-bottom:6px}
  .wprow b{color:var(--cd);font-weight:800}
  .wprow em{font-style:normal;color:var(--cd);font-weight:800;font-size:13px}
  .wbar{height:7px;border-radius:6px;background:#eef1f7;overflow:hidden}
  .wbar i{display:block;height:100%;width:0;border-radius:6px;background:var(--c);
    transition:width .7s cubic-bezier(.22,.8,.26,1)}
  #toast{position:fixed;left:16px;right:16px;bottom:18px;z-index:60;background:#141926;color:#fff;
    border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;box-shadow:0 12px 28px rgba(20,25,38,.3);
    transform:translateY(130%);opacity:0;transition:transform .38s cubic-bezier(.2,.9,.3,1),opacity .3s ease;
    pointer-events:none;max-width:520px;margin:0 auto}
  #toast.on{transform:none;opacity:1}
  #toast b{font-weight:800}
  #toast small{display:block;font-size:11.5px;opacity:.8;margin-top:3px}

  @media (prefers-reduced-motion: reduce){
    *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
    .rfill{transition:none!important}
  }

</style>
</head>
<body>
<header>
  <h1>운동일지</h1>
  <div class="sub" id="today"></div>
</header>

<div class="wrap">
  <div class="tabs">
    <button id="tabHome" class="on">홈</button>

function eqOf(name){
  if(EX_EQ[name])return EX_EQ[name];
  for(const k in EQUIP){if(name.indexOf(EQUIP[k].n)>=0)return k;}
  return null;
}
function partOf(name,fallback){
  if(EX_PART[name])return EX_PART[name];
  const eq=eqOf(name);
  for(const p in RECO){if(RECO[p].some(r=>r[1]===eq&&r[0]===name))return p;}
  return fallback||part;
}

function save(){localStorage.setItem(KEY,JSON.stringify(data));}

/* ── 기록 형식 호환 ──
   새 형식: {setList:[{kg,reps},...]}
   옛 형식: {w? kg, reps, sets} → 같은 무게·횟수를 sets개 행으로 펼칩니다. */
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function recSetList(r){
  if(Array.isArray(r.setList)&&r.setList.length){
    return r.setList.map(s=>({kg:+s.kg||0,reps:+s.reps||0}));
  }
  /* 옛 형식: {w,r,s} (원래 저장 형식) 또는 {kg,reps,sets} */
  const nRaw=(r.s!=null?r.s:(r.sets!=null?r.sets:1));
  const n=Math.max(1,+nRaw||1);
  const kg=+(r.kg!=null?r.kg:(r.w!=null?r.w:0))||0;
  const reps=+(r.reps!=null?r.reps:(r.r!=null?r.r:0))||0;
  const out=[];
  for(let i=0;i<n;i++)out.push({kg:kg,reps:reps});
  return out;
}
const recSets=r=>recSetList(r).length;
const recVolOf=list=>list.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0);
const recVol=r=>recVolOf(recSetList(r));
const recKg=r=>Math.max.apply(null,[0].concat(recSetList(r).map(s=>s.kg)));
function setDetail(r){
  return recSetList(r).map((s,i)=>(i+1)+'세트 '+s.kg+'kg×'+s.reps).join(' · ');
}
function setShort(r){
  const l=recSetList(r);
  if(l.length>1&&l.every(s=>s.kg===l[0].kg&&s.reps===l[0].reps))
    return l[0].kg+'kg × '+l[0].reps+'회 × '+l.length+'세트';
  return l.map(s=>s.kg+'kg×'+s.reps).join(' · ');
}

let formSets=[{kg:'',reps:''}];

  formSets=list.map(s=>({kg:(s.kg==null?'':String(s.kg)),reps:(s.reps==null?'':String(s.reps))}));

    if(!formSets[i])return;
    formSets[i].kg=row.querySelector('.kg').value;
    formSets[i].reps=row.querySelector('.reps').value;

    +'<span class="u">회</span>'
    +'<button class="rm'+(formSets.length<2?' off':'')+'" type="button" data-i="'+i+'" aria-label="'+(i+1)+'세트 삭제">×</button></div>').join('');
  box.querySelectorAll('.kg,.reps').forEach(inp=>inp.addEventListener('input',()=>{readSetInputs();updateVolPrev();}));
  box.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{
    readSetInputs();
    formSets.splice(+b.dataset.i,1);
    if(!formSets.length)formSets=[{kg:'',reps:''}];

  });

function updateVolPrev(){
  let v=0;
  formSets.forEach(s=>{
    const kg=parseFloat(s.kg),r=parseInt(s.reps);
    if(s.kg!==''&&s.reps!==''&&isFinite(kg)&&isFinite(r)&&kg>=0&&r>0)v+=kg*r;
  });
  if($('volPrev'))$('volPrev').textContent=won(v);
  if($('volSets'))$('volSets').textContent=formSets.length+'세트';
}
function collectSets(){
  readSetInputs();
  const out=[];
  for(let i=0;i<formSets.length;i++){
    const ks=formSets[i].kg,rs=formSets[i].reps;
    if(ks===''&&rs==='')continue;                 /* 남은 빈 행은 무시 */
    const kg=parseFloat(ks),r=parseInt(rs);
    if(!isFinite(kg)||kg<0||!isFinite(r)||r<=0)return null;
    out.push({kg:kg,reps:Math.round(r)});
  }
  return out.length?out:null;
}
function applySets(rec,list){
  rec.setList=list.map(s=>({kg:s.kg,reps:s.reps}));
  rec.s=rec.sets=rec.setList.length;
  rec.vol=recVolOf(rec.setList);
  rec.kg=Math.max.apply(null,rec.setList.map(s=>s.kg));
  rec.reps=rec.setList[0].reps;
  return rec;
}
const addSetRow=()=>{

};

/* 요일별 부위 로테이션: getDay() 0=일 … 6=토. 이 배열만 고치면 로테이션이 바뀝니다. */
const ROTATION=[null,'가슴','등','하체','어깨','팔','복부'];
const HPKEY='workoutlog.homepart';
const RM=(window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null);
const reduced=()=>!!(RM&&RM.matches);

function todayRows(){const t=todayStr();return data.filter(x=>x.date===t);}
function weekStats(){
  const ws=weekStart(0).getTime(),en=ws+7*864e5;
  const rows=data.filter(x=>{const t=new Date(x.date+'T00:00:00').getTime();return t>=ws&&t<en;});
  return {rows:rows,vol:rows.reduce((a,x)=>a+recVol(x),0),days:new Set(rows.map(x=>x.date)).size};
}
function streakDays(){
  const days=new Set(data.map(x=>x.date));
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const fm=dd=>dd.getFullYear()+'-'+p(dd.getMonth()+1)+'-'+p(dd.getDate());
  if(!days.has(fm(d)))d.setDate(d.getDate()-1);
  let n=0;
  for(let i=0;i<730;i++){if(!days.has(fm(d)))break;n++;d.setDate(d.getDate()-1);}
  return n;
}
function weekDoneParts(){return new Set(weekStats().rows.map(x=>x.part));}
function suggestedPart(){
  const w0=new Date().getDay(),done=weekDoneParts(),cur=ROTATION[w0];
  if(!cur)return {part:'유산소',rest:true};
  if(!done.has(cur))return {part:cur};
  for(let i=1;w0+i<=6;i++){
    const px=ROTATION[w0+i];
    if(px&&!done.has(px))return {part:px,movedFrom:cur};
  }
  return {part:'유산소',rest:true,allDone:true};
}
function homeOverride(){
  try{
    const o=JSON.parse(localStorage.getItem(HPKEY)||'null');
    if(o&&o.date===todayStr()&&PARTS.indexOf(o.part)>=0)return o.part;
  }catch(e){}
  return null;
}
function setHomeOverride(p){
  try{localStorage.setItem(HPKEY,JSON.stringify({date:todayStr(),part:p}));}catch(e){}
}
function clearHomeOverride(){try{localStorage.removeItem(HPKEY);}catch(e){}}
function modePart(rows){
  const c={};rows.forEach(x=>{c[x.part]=(c[x.part]||0)+1;});
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'가슴';
}
function homeDisplayPart(){
  const ov=homeOverride();
  if(ov)return ov;
  const t=todayRows();
  if(t.length)return modePart(t);
  return suggestedPart().part;
}
function setsNum(s){const m=/(\d+)\s*세트/.exec(s||'');return m?+m[1]:0;}
/* 오늘 할 종목: 내 운동(MY_FAV) 먼저, 부족하면 부위 추천으로 최대 4개 */
function todayList(p){
  const out=[],seen={};
  MY_FAV.forEach(f=>{
    const n=f[0],eq=f[1],sets=f[2],label=f[3];
    if(partOf(n,'')===p&&!seen[n]){seen[n]=1;out.push({n:n,eq:eq,sets:sets,label:label});}
  });
  (RECO[p]||[]).forEach(r=>{
    const n=r[0],eq=r[1],label=r[2],sets=r[3];
    if(out.length<4&&!seen[n]){seen[n]=1;out.push({n:n,eq:eq,sets:sets,label:label});}
  });
  return out.slice(0,4);
}
function planGoal(list){
  let s=0;list.forEach(r=>{s+=setsNum(r.sets);});
  return s||list.length||1;
}

/* 오늘의 운동 히어로: 링·그라데이션으로 움직임 (외부 이미지 없이) */

/* 숫자 카운트업(값은 즉시 확정, 연출만 부드럽게) */
function countUp(el,to,fmt){
  if(!el)return;
  const f=fmt||(v=>won(v));
  if(el._raf){cancelAnimationFrame(el._raf);el._raf=null;}
  if(reduced()||!isFinite(to)){el.textContent=f(to);return;}
  const t0=performance.now(),dur=650;
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=f(to*e);
    if(k<1)el._raf=requestAnimationFrame(step);else el._raf=null;
  };
  el._raf=requestAnimationFrame(step);
}
/* 막대 게이지를 화면에 보일 때 왼쪽→오른쪽으로 순서대로 */

    if(reduced()){el.style.width=w;return;}

}

function renderHome(){
  const card=$('todayCard');
  if(!card)return;
  const t=todayRows(),ov=homeOverride(),sug=suggestedPart();
  const p=homeDisplayPart();
  const restDay=!t.length&&!ov&&sug.rest;
  const plan=restDay
    ?RECO['유산소'].slice(0,2).map(r=>({n:r[0],eq:r[1],label:r[2],sets:r[3]}))
    :todayList(p);
  const goal=planGoal(plan);
  const hasSets=plan.some(r=>setsNum(r.sets)>0);
  const mine=t.filter(x=>x.part===p);
  const doneSets=mine.reduce((a,x)=>a+recSets(x),0);
  const mineVol=mine.reduce((a,x)=>a+recVol(x),0);
  const mineExs=[];mine.forEach(x=>{if(mineExs.indexOf(x.ex)<0)mineExs.push(x.ex);});
  const doneNum=hasSets?doneSets:mineExs.length;
  const pct=goal?Math.min(1,doneNum/goal):0;
  const complete=mine.length>0&&doneNum>=goal;
  const doing=mine.length>0&&!complete;
  paintColor(card,p);

  const dd=new Date();
  const dateTxt=(dd.getMonth()+1)+'월 '+dd.getDate()+'일 '+wd[dd.getDay()]+'요일';
  let title=p,tag='요일 로테이션',sub=plan.length+'종목'+(hasSets?' · '+goal+'세트 예정':' 예정');
  if(ov&&!t.length){tag='직접 고름';}
  if(restDay){
    title='휴식';tag='로테이션';
    sub=sug.allDone?'이번 주 로테이션은 다 도셨어요. 남은 날은 가볍게.':'오늘은 쉬는 날 — 가볍게 걷거나 스트레칭으로 몸을 풀어 주세요.';
  }else if(complete){
    tag='완료';
    sub=mineExs.length+'종목 · '+doneSets+'세트 · '+won(mineVol)+'kg';
  }else if(doing){
    tag='진행 중';
    sub=mineExs.length+'종목 · '+doneSets+'세트 · '+won(mineVol)+'kg';
  }

  const C=2*Math.PI*34;
  const center=complete
    ?'<svg class="chkpop" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l4.8 4.8L19.5 7"/></svg>'
    :'<b>'+doneNum+'</b><span>/'+goal+(hasSets?'세트':'개')+'</span>';
  const startOff=reduced()?C*(1-pct):C;
  const ringHTML=restDay?'':'<div class="hring"><svg class="rsvg" viewBox="0 0 86 86">'
    +'<circle class="rtrack" cx="43" cy="43" r="34" stroke-width="7"/>'
    +'<circle class="rfill" cx="43" cy="43" r="34" stroke-width="7" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+startOff.toFixed(1)+'" transform="rotate(-90 43 43)"/>'
    +'</svg><div class="rcenter">'+center+'</div></div>';

  let html='<div class="hero">'
    +'<div class="hrow1"><span>오늘의 운동</span><span>'+dateTxt+'</span></div>'
    +'<div class="hmain"><div class="hleft"><b>'+title+'</b><span class="htag">'+tag+'</span>'
    +'<div class="hsub">'+sub+'</div></div>'+ringHTML+'</div></div><div class="tbody">';

  if(complete){
    html+='<div class="tlist">'+mine.slice(0,3).map(x=>
      homeRowHTML(x.ex,eqOf(x.ex),recSets(x)+'세트',null,setShort(x),true)).join('')
      +(mine.length>3?'<div class="tmore">기록 '+(mine.length-3)+'건 더 있어요</div>':'')+'</div>';
  }else{
    const doneNames={};mine.forEach(x=>{doneNames[x.ex]=1;});
    if(doing)html+='<div class="tcnote">오늘 '+doneNum+' / '+goal+(hasSets?'세트':'개')+' 하셨어요. 남은 종목을 마저 해 보세요.</div>';
    else if(t.length)html+='<div class="tcnote">오늘 「'+modePart(t)+'」 기록이 이미 있어요. 부위를 바꿔 보는 중입니다.</div>';
    else if(sug.movedFrom&&!ov)html+='<div class="tcnote">이번 주에 「'+sug.movedFrom+'」 기록이 있어 오늘은 「'+p+'」로 당겼어요.</div>';
    html+='<div class="tlist">'+plan.map(r=>homeRowHTML(r.n,r.eq,r.sets,r.label,null,!!doneNames[r.n])).join('')+'</div>';
  }

  const btnLabel=complete?'오늘 기록 더 하기':(restDay?'가볍게 기록하기':'오늘 운동 기록하기');
  html+='<button class="btn tbtn" data-act="go" data-p="'+p+'">'+btnLabel+'</button>'
    +'<div class="hpick"><div class="hplabel">부위 바꾸기</div><div class="hchips">'
    +PARTS.map(x=>'<button class="hchip'+(x===p?' on':'')+'" data-p="'+x+'" style="--c:'+PC(x).c+';--cd:'+PC(x).cd+'"><i></i>'+x+'</button>').join('')
    +'</div></div></div>';

  card.innerHTML=html;

  const rf=card.querySelector('.rfill');
  if(rf&&!reduced())requestAnimationFrame(()=>{rf.style.strokeDashoffset=(C*(1-pct)).toFixed(1);});

  card.querySelectorAll('[data-ex]').forEach(b=>{
    b.onclick=()=>{
      const n=b.dataset.ex;
      part=partOf(n,homeDisplayPart());
      markChips();renderReco();
      showTab('write');
      fillExercise(n,eqOf(n));
    };
  });
  card.querySelectorAll('.hchip').forEach(b=>{
    b.onclick=()=>{
      setHomeOverride(b.dataset.p);
      part=b.dataset.p;markChips();renderReco();renderHome();
    };
  });
  const go=card.querySelector('[data-act="go"]');
  if(go)go.onclick=()=>{
    part=go.dataset.p;markChips();renderReco();showTab('write');
  };

  const w=weekStats();
  countUp($('hWeek'),w.vol,v=>won(v)+'kg');
  countUp($('hDays'),w.days,v=>Math.round(v)+'일');
  countUp($('hStreak'),streakDays(),v=>Math.round(v)+'일');
  renderRecent();
}
function renderRecent(){
  const box=$('hRecent');
  if(!box)return;
  const rows=data.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)).slice(0,3);
  if(!rows.length){box.innerHTML='<div class="empty" style="padding:16px 6px">아직 기록이 없어요. 오늘부터 하나씩 쌓아 보세요.</div>';return;}
  box.innerHTML=rows.map(x=>{
    const dd=new Date(x.date+'T00:00:00');
    return '<button class="hrow" data-id="'+x.id+'" style="--c:'+PC(x.part).c+'" title="눌러서 수정">'
      +'<div class="t"><b>'+esc(x.ex)+'</b><small>'+x.part+' · '+(dd.getMonth()+1)+'월 '+dd.getDate()+'일 '+wd[dd.getDay()]+' · '+recSets(x)+'세트</small></div>'
      +'<span class="rdate">'+won(recVol(x))+'kg</span></button>';
  }).join('');
}
function renderWriteProg(){
  const list=todayList(part),goal=planGoal(list);
  const hasSets=list.some(r=>setsNum(r.sets)>0);
  const mine=data.filter(x=>x.date===todayStr()&&x.part===part);
  const doneSets=mine.reduce((a,x)=>a+recSets(x),0);
  const exs=[];mine.forEach(x=>{if(exs.indexOf(x.ex)<0)exs.push(x.ex);});
  const done=hasSets?doneSets:exs.length;
  const pp=$('wProgPart');
  if(!pp)return;
  pp.textContent=part;pp.style.color=PC(part).cd;
  $('wProgNum').textContent=done;$('wProgNum').style.color=PC(part).cd;
  $('wProgGoal').textContent=goal;
  if($('wProgUnit'))$('wProgUnit').textContent=hasSets?'세트':'개';
  const bar=$('wProgBar');
  bar.style.background=PC(part).c;
  bar.style.width=Math.min(100,goal?done/goal*100:0)+'%';
  return {done:done,goal:goal};
}
function openRecord(id){
  showTab('write');
  render();
  const el=document.querySelector('#list .item[data-id="'+id+'"]');
  if(!el)return;
  el.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'});
  el.classList.add('rowflash');
  setTimeout(()=>el.classList.remove('rowflash'),1700);
}
const VIEWS={home:['tabHome','viewHome'],write:['tabWrite','viewWrite'],stat:['tabStat','viewStat']};
function showTab(k){
  Object.keys(VIEWS).forEach(x=>{
    $(VIEWS[x][0]).classList.toggle('on',x===k);
    $(VIEWS[x][1]).classList.toggle('hide',x!==k);
  });
  const v=$(VIEWS[k][1]);
  v.classList.remove('viewin');
  void v.offsetWidth;
  if(!reduced())v.classList.add('viewin');
  if(k==='stat')renderStat();
  if(k==='home')renderHome();
  window.scrollTo(0,0);
}

function weekStart(offset){
  const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day-(offset||0)*7);d.setHours(0,0,0,0);return d;
}
function renderStat(){
  const w0=weekStats();
  countUp($('sWeek'),w0.vol,v=>won(v)+'kg');
  countUp($('sDays'),w0.days,v=>Math.round(v)+'일');

  const from=Date.now()-30*864e5;
  const recent=data.filter(x=>new Date(x.date+'T00:00:00').getTime()>=from);
  const pm={};recent.forEach(x=>{pm[x.part]=(pm[x.part]||0)+recVol(x);});
  const max=Math.max(1,...Object.values(pm));
  $('partStat').innerHTML=Object.keys(pm).length?Object.entries(pm).sort((a,b)=>b[1]-a[1]).map(([p,v])=>
    '<div class="part" style="--c:'+PC(p).c+'"><div class="top"><span><i class="dotr"></i>'+p+'</span><span>'+won(v)+'kg</span></div>'
    +'<div class="bar"><i data-w="'+(v/max*100).toFixed(0)+'%" style="background:'+PC(p).c+';width:0.01%"></i></div></div>').join(''):'<div class="empty">최근 30일 기록이 없어요.</div>';

  let wh='';
  for(let i=5;i>=0;i--){
    const st=weekStart(i).getTime(), en=st+7*864e5;
    const v=data.filter(x=>{const t=new Date(x.date+'T00:00:00').getTime();return t>=st&&t<en;}).reduce((a,x)=>a+recVol(x),0);
    wh+='<div class="part"><div class="top"><span>'+(i===0?'이번 주':(i+'주 전'))+'</span><span>'+won(v)+'kg</span></div>'
      +'<div class="bar"><i data-w="'+Math.min(100,v/Math.max(1,20000)*100).toFixed(0)+'%" style="width:0.01%;background:linear-gradient(90deg,#8b6cf6,#5a45e8)"></i></div></div>';
  }
  $('weekStat').innerHTML=wh;
  growBars($('partStat'));growBars($('weekStat'));

  const pr={},prp={};data.forEach(x=>{const k=recKg(x);if(!pr[x.ex]||k>pr[x.ex]){pr[x.ex]=k;prp[x.ex]=x.part;}});
  $('prStat').innerHTML=Object.keys(pr).length?Object.entries(pr).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([e,v])=>
    '<div class="item"><div class="name"><b>'+esc(e)+'</b><small><span class="dotr" style="--c:'+PC(prp[e]).c+'"></span>'+prp[e]+'</small></div>'
    +'<div class="vol">'+v+'kg</div></div>').join(''):'<div class="empty">기록이 쌓이면 최고 무게가 보여요.</div>';
}
function exportFile(){
  if(!data.length){alert('내보낼 기록이 없어요.');return;}
  let csv='날짜,부위,종목,세트별,세트수,총볼륨,최고무게,메모\n';
  data.slice().sort((a,b)=>(a.date<b.date?-1:1)).forEach(x=>{
    const list=recSetList(x);
    const detail=list.map((s,i)=>(i+1)+'세트 '+s.kg+'kg×'+s.reps).join(' / ');
    csv+=[x.date,x.part,'"'+x.ex.replace(/"/g,'')+'"','"'+detail+'"',list.length,recVol(x),recKg(x),'"'+(x.m||'').replace(/"/g,'')+'"'].join(',')+'\n';
  });
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='운동일지_'+todayStr()+'.csv';a.click();
}
$('save').onclick=addItem;
$('addSet').onclick=addSetRow;
$('cancelEdit').onclick=()=>cancelEdit();
$('tabHome').onclick=()=>showTab('home');
$('tabWrite').onclick=()=>showTab('write');
$('tabStat').onclick=()=>showTab('stat');
$('hRecent').onclick=e=>{const b=e.target.closest('[data-id]');if(b&&$('hRecent').contains(b))startEdit(b.dataset.id);};
$('exportBtn').onclick=e=>{e.preventDefault();exportFile();};
$('ex').addEventListener('input',()=>{
  const n=$('ex').value.trim();
  if(!n){$('lastHint').innerHTML='';return;}
  setLastHint(n,'');
});
initToday();initChips();refreshExList();render();
setFormSets([{kg:'',reps:''}]);updateFormMode();
part=homeDisplayPart();markChips();renderReco();
showTab('home');
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
