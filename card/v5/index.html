<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>박재용 · 글로벌비전교회 담임목사</title>
<meta name="description" content="박재용 Th.D · 글로벌비전교회 담임목사 전자명함 (시안 5 · 컬러 블록)">
<meta name="theme-color" content="#122A4B">
<meta name="card-url" content="https://aichurchsystem.github.io/Church/card/v5/">
<meta property="og:type" content="profile">
<meta property="og:title" content="박재용 · 글로벌비전교회 담임목사">
<meta property="og:description" content="글로벌비전교회 담임목사 박재용입니다. 연락처를 저장하거나 QR로 전달하실 수 있습니다.">
<meta property="og:url" content="https://aichurchsystem.github.io/Church/card/v5/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23122A4B'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-size='24' font-weight='bold' fill='%23fff' text-anchor='middle'%3EGV%3C/text%3E%3C/svg%3E">
<style>
  @font-face{font-family:"PD";src:url("fonts/pretendard-400.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"PD";src:url("fonts/pretendard-500.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"PD";src:url("fonts/pretendard-600.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"PD";src:url("fonts/pretendard-700.woff2") format("woff2");font-weight:700;font-display:swap}

  :root{
    --navy:#122A4B;
    --navy2:#0C1F3B;
    --navy-soft:#2C4A76;
    --tile:#EDF2FA;
    --ink:#101828;
    --ink2:#33405A;
    --mute:#7C879B;
    --line:#E4E9F1;
    --gold:#D9C08A;
    --sans:"PD","Apple SD Gothic Neo",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    background:radial-gradient(90% 70% at 50% 0%, #E9EDF4 0%, #DDE3EC 60%, #D3DAE6 100%);
    color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .card{
    position:relative;z-index:1;width:100%;max-width:412px;background:#fff;overflow:hidden;
    border-radius:18px;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 2px 6px rgba(16,24,40,.10),
               0 20px 44px -20px rgba(16,24,40,.45),0 48px 80px -40px rgba(16,24,40,.35);
    animation:rise .65s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ── 상단 컬러 블록 ── */
  .hero{
    position:relative;overflow:hidden;color:#fff;
    background:
      radial-gradient(80% 120% at 92% -20%, rgba(96,140,205,.42) 0%, rgba(96,140,205,0) 62%),
      linear-gradient(152deg,#173762 0%,#122A4B 52%,#0B1D37 100%);
    padding:16px 20px 18px;
  }
  .hero::before{
    content:"";position:absolute;right:-58px;top:-52px;width:212px;height:212px;border-radius:50%;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 0 0 26px rgba(255,255,255,.035),0 0 0 54px rgba(255,255,255,.022);
    pointer-events:none;
  }
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.38;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 1px, transparent 1px 9px);
    -webkit-mask-image:radial-gradient(130% 130% at 0% 0%, rgba(0,0,0,.15) 0%, #000 68%);
    mask-image:radial-gradient(130% 130% at 0% 0%, rgba(0,0,0,.15) 0%, #000 68%);
  }
  .hrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{height:22px;width:auto;display:block;opacity:.96}
  .hrow .tag{font-size:9px;letter-spacing:.24em;color:rgba(226,236,250,.6);text-transform:uppercase}

  .nm{position:relative;margin-top:20px}
  .nameline{display:flex;align-items:baseline;gap:7px}
  h1{margin:0;font-size:41px;line-height:1;font-weight:700;letter-spacing:-.02em}
  .deg{font-size:12px;font-weight:500;letter-spacing:.1em;color:var(--gold)}
  .en{margin:8px 0 0;font-size:10px;font-weight:500;letter-spacing:.34em;color:rgba(226,236,250,.62);text-transform:uppercase}
  .role{
    margin:11px 0 0;display:flex;align-items:center;gap:8px;
    font-size:13px;font-weight:500;color:rgba(240,246,253,.94);
  }
  .role .bar{width:16px;height:2px;background:var(--gold);flex:0 0 auto}
  .role span{font-size:9.5px;letter-spacing:.18em;color:rgba(226,236,250,.5);text-transform:uppercase}

  /* ── 하단 흰 블록 ── */
  .body{padding:6px 16px 14px}
  .row{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:8px 4px;border:0;border-bottom:1px solid var(--line);
    background:none;font-family:inherit;text-align:left;color:inherit;text-decoration:none;cursor:pointer;
    transition:background .16s ease;
  }
  .row:last-child{border-bottom:0}
  .row:active{background:#F5F8FC}
  .tile{
    flex:0 0 32px;height:32px;border-radius:9px;background:var(--tile);
    display:grid;place-items:center;color:var(--navy);
  }
  .tile svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .lbl{flex:0 0 52px;font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
  .val{
    flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:600;letter-spacing:-.005em;color:var(--ink);
    font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere;
  }
  .val.mail{font-size:13px;font-weight:500}
  .val.addr{font-size:12.5px;font-weight:500;line-height:1.35;color:var(--ink2);word-break:keep-all;text-align:left}
  .row.addr-row{flex-wrap:wrap;row-gap:1px;align-items:center}
  .row.addr-row .lbl{width:auto}
  .row.addr-row .val{flex:1 0 100%;padding-left:43px}
  .copy{flex:0 0 auto;font-size:9px;font-weight:600;letter-spacing:.08em;color:var(--navy);
        border:1px solid #C9D6EA;background:#F5F8FC;border-radius:4px;padding:2px 5px}

  .actions{display:flex;gap:8px;margin-top:12px}
  .btn{
    appearance:none;border:0;cursor:pointer;font-family:var(--sans);
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    height:46px;border-radius:11px;font-size:13.5px;font-weight:600;letter-spacing:.01em;
  }
  .btn:active{opacity:.9}
  .save{
    flex:1 1 auto;color:#fff;
    background:linear-gradient(160deg,#1B4070,#122A4B);
    box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 10px 20px -12px rgba(18,42,75,.9);
  }
  .save svg{width:15px;height:15px;fill:none;stroke:#DCE6F6;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .qrbtn{flex:0 0 48px;padding:0;background:#fff;border:1px solid var(--line)}
  .qrbtn img{width:32px;height:32px;display:block}

  .foot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:11px;padding-top:9px;border-top:1px solid var(--line);
    font-size:8.5px;letter-spacing:.18em;color:#A6B0C2;text-transform:uppercase;
  }

  /* QR 모달 */
  .modal{
    position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(8,18,34,.88);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  }
  .modal[data-open="true"]{display:flex;animation:fade .2s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:310px;background:#fff;border-radius:16px;padding:22px 20px 16px;text-align:center}
  .sheet h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
  .sheet p{margin:8px 0 13px;font-size:11.5px;line-height:1.6;color:var(--mute)}
  .sheet img{width:100%;max-width:208px;height:auto;display:block;margin:0 auto;border:1px solid var(--line);border-radius:6px}
  .sheet .url{margin:11px 0 0;font-size:10.5px;color:var(--ink2);background:#F3F6FB;border-radius:8px;padding:8px;word-break:break-all}
  .sheet button{
    margin-top:9px;width:100%;height:40px;border:0;border-radius:10px;cursor:pointer;
    font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.03em;color:#fff;background:var(--navy);
  }
  .sheet button.sub{background:#F3F6FB;color:var(--navy);border:1px solid var(--line)}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);
    background:var(--navy);color:#fff;font-size:12px;font-weight:500;letter-spacing:.02em;
    padding:10px 17px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;z-index:30;white-space:nowrap;
    box-shadow:0 12px 30px rgba(8,18,34,.45);
  }
  .toast[data-show="true"]{opacity:1;transform:translate(-50%,0)}

  @media (max-height:720px){
    body{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
    .hero{padding:13px 17px 15px}
    .nm{margin-top:14px}
    h1{font-size:36px}
    .role{margin-top:9px}
    .body{padding:4px 13px 12px}
    .row{padding:6.5px 3px}
    .tile{flex:0 0 29px;height:29px;border-radius:8px}
    .val{font-size:14px}
    .btn{height:42px}
    .actions{margin-top:10px}
    .foot{margin-top:9px;padding-top:7px}
  }
  @media (max-width:370px){
    .hero{padding:15px 16px 16px}
    h1{font-size:38px}
    .lbl{flex:0 0 46px;font-size:10px}
    .val{font-size:13.8px}
    .val.mail{font-size:12.2px}
    .val.addr{font-size:11.8px}
  }
  @media (prefers-reduced-motion:reduce){.card{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<main class="card" data-fit>

  <header class="hero">
    <div class="hrow">
      <img class="logo" src="logo.png" alt="글로벌비전교회">
      <span class="tag">Senior Pastor</span>
    </div>
    <div class="nm">
      <div class="nameline">
        <h1>박재용</h1><span class="deg">Th.D</span>
      </div>
      <p class="en">Park Jaeyong</p>
      <p class="role"><span class="bar" aria-hidden="true"></span>글로벌비전교회 담임목사<span>· Seoul</span></p>
    </div>
  </header>

  <div class="body">
    <a class="row" href="tel:+821053283683">

      <span class="lbl">휴대전화</span><span class="val">010-5328-3683</span>
    </a>
    <a class="row" href="tel:+8224291318">
      <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4.5 20.5v-2.2a3 3 0 0 1 3-3h9a3 3 0 0 1 3 3v2.2"/><path d="M12 3.5 13.4 7l3.7.3-2.8 2.4.9 3.6-3.2-2-3.2 2 .9-3.6L6.9 7.3 10.6 7Z"/></svg></span>
      <span class="lbl">교회 전화</span><span class="val">02-429-1318</span>
    </a>
    <button class="row" type="button" data-fax>
      <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6.5" y="3.5" width="11" height="5"/><rect x="3.5" y="8.5" width="17" height="8" rx="1.8"/><path d="M6.5 14.5h11v6h-11z"/></svg></span>
      <span class="lbl">팩스</span><span class="val">02-429-1319</span><span class="copy">복사</span>
    </button>
    <a class="row" href="mailto:pjy53283683@gmail.com">
      <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.2" y="5.5" width="17.6" height="13" rx="2"/><path d="m4 7 8 5.6L20 7"/></svg></span>
      <span class="lbl">이메일</span><span class="val mail">pjy53283683@gmail.com</span>
    </a>
    <a class="row addr-row" href="https://map.naver.com/p/search/%EC%84%9C%EC%9A%B8%20%EA%B4%91%EC%A7%84%EA%B5%AC%20%EA%B5%AC%EC%9D%98%EA%B0%95%EB%B3%80%EB%A1%9C3%EA%B0%80%EA%B8%B8%2033" target="_blank" rel="noopener">
      <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s6.4-5.6 6.4-10.3A6.4 6.4 0 0 0 5.6 10.7C5.6 15.4 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/></svg></span>
      <span class="lbl">주소</span><span class="val addr">서울 광진구 구의강변로3가길 33 상가 2층</span>
    </a>

    <div class="actions">
      <button class="btn save" type="button" data-save>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v10"/><path d="m8 10.5 4 4 4-4"/><path d="M4.5 19.5h15"/></svg>
        연락처에 저장
      </button>
      <button class="btn qrbtn" type="button" data-qr aria-label="QR 코드 크게 보기">
        <img src="qr.png" alt="">
      </button>
    </div>

    <p class="foot"><span>Global Vision Presbyterian Church</span><span>Scan</span></p>
  </div>
</main>

<div class="modal" data-qr-modal role="dialog" aria-modal="true" aria-label="QR 코드">
  <div class="sheet">
    <h2>명함 주소 QR</h2>
    <p>카메라로 비추면 이 명함이 열립니다.</p>
    <img src="qr.png" alt="전자명함 QR 코드">
    <div class="url">aichurchsystem.github.io/Church/card/v5/</div>
    <button type="button" data-copy-url>주소 복사</button>
    <button type="button" class="sub" data-close-qr>닫기</button>
  </div>
</div>

<div class="toast" data-toast role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
